<!doctype html>
<meta charset="utf-8">
<title>Конвейер ассетов — живая панель</title>
<style>
  :root {
    --bg: #0d0f16;  --panel: #141824;  --line: #232a3c;
    --text: #e8ecf5; --dim: #8b96ad;   --accent: #5ac8fa;
    --ok: #45d68a;   --hot: #ffd400;   --warn: #ff5470;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }

  /* ---------- шапка ---------- */
  header { padding: 14px 22px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  .device { color: var(--accent); font-weight: 600; }
  .spacer { flex: 1; }
  .stat { color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block;
         margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(69,214,138,.7); animation: pulse 2s infinite; }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 7px rgba(69,214,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(69,214,138,0); }
  }

  .bar { margin-top: 12px; height: 8px; border-radius: 5px; background: #0a0c12; overflow: hidden; position: relative; }
  .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #2f7fd4, var(--accent));
    transition: width .6s cubic-bezier(.2,.8,.2,1);
  }
  .bar.busy::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* ---------- раскладка ---------- */
  main { display: grid; grid-template-columns: 290px 1fr 300px; min-height: 0; }
  section { min-height: 0; overflow: auto; padding: 16px; }
  #steps { border-right: 1px solid var(--line); background: #10131d; }
  #feed  { border-left: 1px solid var(--line); background: #10131d; }
  h2 { margin: 0 0 12px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); }

  /* ---------- шаги ---------- */
  .step {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 9px 10px;
    border-radius: 9px; margin-bottom: 3px; border: 1px solid transparent; transition: .25s;
  }
  .step .mark {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-size: 11px; color: var(--dim);
  }
  .step .t { font-size: 13px; }
  .step .h { font-size: 11px; color: var(--dim); }
  .step.done .mark { border-color: var(--ok); color: var(--ok); }
  .step.done .t { color: var(--ok); }
  .step.skipped .mark { border-style: dashed; }
  .step.skipped .t { color: var(--dim); text-decoration: line-through; }
  .step.active {
    background: rgba(90,200,250,.08); border-color: rgba(90,200,250,.35);
  }
  .step.active .mark {
    border-color: var(--accent); color: var(--accent);
    animation: spin 1.1s linear infinite; border-right-color: transparent;
  }
  .step.active .t { color: var(--accent); font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- «сейчас» ---------- */
  .now {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid rgba(90,200,250,.3); border-radius: 11px; background: rgba(90,200,250,.06);
  }
  .now.idle { border-color: var(--line); background: #12161f; color: var(--dim); }
  .beam { width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
          animation: blink 1s ease-in-out infinite; flex: none; }
  .now.idle .beam { background: var(--dim); animation: none; }
  @keyframes blink { 50% { opacity: .25; transform: scale(.7); } }

  /* ---------- галерея ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel);
    animation: rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .card.hot { border-color: var(--hot); box-shadow: 0 0 0 1px rgba(255,212,0,.25), 0 8px 30px rgba(0,0,0,.5); }
  .shot {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden;
    background-color: #171b26;
    background-image:
      linear-gradient(45deg, #1b2030 25%, transparent 25%, transparent 75%, #1b2030 75%),
      linear-gradient(45deg, #1b2030 25%, transparent 25%, transparent 75%, #1b2030 75%);
    background-size: 18px 18px; background-position: 0 0, 9px 9px;
  }
  .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cap { padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
  .cap b { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap span { font-size: 11px; color: var(--dim); margin-left: auto; white-space: nowrap; }
  .tag {
    font-size: 10px; letter-spacing: .6px; text-transform: uppercase; padding: 2px 7px;
    border-radius: 20px; border: 1px solid var(--line); color: var(--dim);
  }
  .tag.generated { color: #b79bff; border-color: #4a3d7a; }
  .tag.scan { color: var(--accent); border-color: #2b5f80; }
  .tag.cut { color: #7ee0c0; border-color: #2c6355; }
  .tag.marked { color: var(--hot); border-color: #6b5a00; }
  .tag.punched { color: #ff9d5c; border-color: #7a4a26; }
  .tag.parts { color: #ff8fd0; border-color: #7a3a63; }
  .tag.build { color: var(--ok); border-color: #2a6b4b; }

  /* сканирующий луч поверх картинки, пока агент её разглядывает */
  .shot.scan::after {
    content: ''; position: absolute; left: 0; right: 0; height: 34%;
    background: linear-gradient(180deg, transparent, rgba(90,200,250,.32), transparent);
    animation: scan 1.8s ease-in-out infinite;
  }
  @keyframes scan { 0% { top: -34%; } 100% { top: 100%; } }

  /* шторка «фон уходит»: слева проступает шахматка прозрачности */
  .shot.cut img { animation: reveal 1.1s ease-out both; }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* метки дыр */
  .mk {
    position: absolute; width: 13px; height: 13px; margin: -7px 0 0 -7px;
    border: 2px solid var(--hot); border-radius: 50%; background: rgba(255,212,0,.18);
    animation: pop .4s cubic-bezier(.2,1.4,.4,1) both, throb 1.8s ease-in-out infinite 0.4s;
  }
  .mk.free { border-color: #ff5470; background: rgba(255,84,112,.18); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  @keyframes throb { 50% { transform: scale(1.45); opacity: .55; } }

  .badge {
    position: absolute; left: 8px; top: 8px; font-size: 10px; padding: 2px 7px; border-radius: 20px;
    background: rgba(0,0,0,.6); color: var(--hot); letter-spacing: .4px;
  }

  /* ---------- лента ---------- */
  .row { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .row:last-child { border: 0; }
  .row .w { color: var(--dim); font-size: 11px; }
  .row .d { color: var(--accent); font-size: 11px; }
  .row.fresh { animation: flash 1.2s ease-out both; }
  @keyframes flash { from { background: rgba(90,200,250,.16); } }

  .empty { color: var(--dim); font-size: 13px; padding: 30px 0; text-align: center; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #262d3f; border-radius: 5px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header>
  <div class="top">
    <h1>Конвейер ассетов <span class="device" id="device"></span></h1>
    <div class="stat" id="counts">—</div>
    <div class="spacer"></div>
    <div class="stat"><span class="dot" id="link"></span><span id="linkText">подключаюсь…</span></div>
  </div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
</header>

<main>
  <section id="steps"><h2>Шаги</h2><div id="stepList"></div></section>

  <section id="stage">
    <div class="now idle" id="now"><span class="beam"></span><span id="nowText">жду начала работы</span></div>
    <h2>Картинки конвейера</h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="gridEmpty">пока пусто — как только пойдут генерации, они появятся здесь</div>
  </section>

  <section id="feed"><h2>Лента</h2><div id="feedList"></div></section>
</main>

<script>
const STAGE_RU = {
  generated: 'сгенерировано', scan: 'смотрю', cut: 'фон убран',
  marked: 'метки дыр', punched: 'дыры пробиты', parts: 'нарезано', build: 'сборка',
};
const $ = id => document.getElementById(id);
let lastVersion = -1, seenFeed = 0;

function timeStr(ts) {
  return ts ? new Date(ts * 1000).toLocaleTimeString('ru-RU', { hour12: false }) : '';
}

function imgURL(path, w) {
  return '/img?w=' + w + '&p=' + encodeURIComponent(path);
}

function renderSteps(steps) {
  const box = $('stepList');
  box.innerHTML = '';
  steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'step ' + s.status;
    const glyph = s.status === 'done' ? '✓' : (s.status === 'active' ? '' : i + 1);
    el.innerHTML = '<div class="mark">' + glyph + '</div>'
      + '<div><div class="t">' + s.title + '</div><div class="h">' + s.hint + '</div></div>';
    box.appendChild(el);
  });
}

function renderGallery(images) {
  const grid = $('grid');
  $('gridEmpty').style.display = images.length ? 'none' : '';

  const alive = new Set();
  for (const it of images) {
    alive.add(it.path);
    let card = grid.querySelector('[data-p="' + CSS.escape(it.path) + '"]');
    if (!card) {
      card = document.createElement('div');
      card.className = 'card';
      card.dataset.p = it.path;
      card.innerHTML =
        '<div class="shot"><img alt=""></div>' +
        '<div class="cap"><b></b><span class="tag"></span><span class="n"></span></div>';
      grid.appendChild(card);
    }
    const shot = card.querySelector('.shot');
    const img = card.querySelector('img');
    const stamp = it.stage + '|' + it.ts;
    if (card.dataset.stamp !== stamp) {
      card.dataset.stamp = stamp;
      // ?v= ломает кеш: файл мог быть перезаписан на месте (punch/shrink)
      img.src = imgURL(it.path, 520) + '&v=' + Math.round(it.ts);
      shot.className = 'shot ' + it.stage;
      shot.querySelectorAll('.mk, .badge').forEach(n => n.remove());
      if (it.marks && it.marks.length) {
        it.marks.forEach((m, k) => {
          const d = document.createElement('i');
          d.className = 'mk' + (m.enclosed ? '' : ' free');
          d.style.left = m.x + '%';
          d.style.top = m.y + '%';
          d.style.animationDelay = (k * 45) + 'ms, ' + (400 + k * 45) + 'ms';
          shot.appendChild(d);
        });
        const b = document.createElement('div');
        b.className = 'badge';
        b.textContent = 'меток: ' + it.marks.length;
        shot.appendChild(b);
      }
      card.querySelector('b').textContent = it.name;
      const tag = card.querySelector('.tag');
      tag.className = 'tag ' + it.stage;
      tag.textContent = STAGE_RU[it.stage] || it.stage;
      card.querySelector('.n').textContent = it.note || '';
    }
    card.classList.toggle('hot', !!it.hot);
  }
  grid.querySelectorAll('.card').forEach(c => {
    if (!alive.has(c.dataset.p)) c.remove();
  });
}

function renderFeed(feed) {
  const box = $('feedList');
  box.innerHTML = '';
  feed.slice().reverse().forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'row' + (feed.length > seenFeed && i === 0 ? ' fresh' : '');
    el.innerHTML = '<div>' + f.text + '</div>'
      + '<div class="w">' + timeStr(f.ts) + (f.detail ? ' · <span class="d">' + f.detail + '</span>' : '') + '</div>';
    box.appendChild(el);
  });
  seenFeed = feed.length;
}

function paint(s) {
  $('device').textContent = s.device ? '· ' + s.device : '';
  $('counts').textContent = s.done + ' из ' + s.total + ' шагов'
    + (s.parts_total ? ' · деталей нарезано ' + s.parts_total : '')
    + (s.assemble_iters ? ' · итераций сборки ' + s.assemble_iters : '');
  $('barFill').style.width = s.progress + '%';
  $('bar').classList.toggle('busy', !!s.current);

  const now = $('now');
  now.classList.toggle('idle', !s.current);
  $('nowText').textContent = s.current
    ? s.current.label
    : (s.done ? 'жду следующего шага' : 'жду начала работы');

  renderSteps(s.steps);
  renderGallery(s.images);
  renderFeed(s.feed);
}

async function tick() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const s = await r.json();
    $('link').classList.add('on');
    $('linkText').textContent = 'на связи';
    if (s.version !== lastVersion) { lastVersion = s.version; paint(s); }
  } catch (e) {
    $('link').classList.remove('on');
    $('linkText').textContent = 'нет связи с сервером панели';
  }
}
tick();
setInterval(tick, 700);
</script>
