<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Asset Viewer — слоёная сборка</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --text: #e8eaef; --dim: #98a0b0; --accent: #5ac8fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }

  #drop {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; z-index: 20;
    background: rgba(20,22,26,.92); transition: opacity .15s;
  }
  #drop .box {
    border: 2px dashed var(--line); border-radius: 14px; padding: 40px 52px; max-width: 620px;
  }
  #drop.hide { opacity: 0; pointer-events: none; }
  #drop.hot .box { border-color: var(--accent); background: rgba(90,200,250,.06); }
  #drop h2 { margin: 0 0 10px; font-size: 18px; }
  #drop p { margin: 6px 0; color: var(--dim); }
  #drop code { color: var(--accent); }
  #pick { margin-top: 14px; }

  #stage { position: absolute; inset: 0; perspective: 2600px; overflow: hidden;
           cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .part {
    position: absolute; transform-style: preserve-3d;
    background-repeat: no-repeat; image-rendering: auto;
    outline: 0 solid rgba(90,200,250,0); transition: outline-color .15s;
  }
  .part.hi { outline: 2px solid var(--accent); }
  .shadow { position: absolute; background: #000; opacity: .18; filter: blur(6px); }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl label { color: var(--dim); font-size: 12px; min-width: 74px; }
  input[type=range] { width: 190px; accent-color: var(--accent); }
  button {
    background: #262b34; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: rgba(90,200,250,.14); border-color: var(--accent); }

  #list {
    position: absolute; right: 0; top: 0; bottom: 0; width: 250px; z-index: 10;
    background: rgba(28,31,38,.94); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 8px; transform: translateX(100%); transition: transform .2s;
  }
  #list.open { transform: none; }
  .row {
    display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .row:hover { background: rgba(90,200,250,.12); }
  .row .n { color: var(--dim); }
  .row.off { opacity: .4; }
  #err { color: #ff8a80; padding: 10px 16px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Device Asset Viewer</h1>
  <span class="meta" id="meta">файлы не загружены</span>
  <span style="flex:1"></span>
  <button id="toggleList">Детали</button>
  <button id="reload">Загрузить другой</button>
</header>

<main>
  <div id="stage"><div id="world"></div></div>
  <aside id="list"></aside>

  <div id="drop">
    <div class="box">
      <h2>Перетащи сюда ассет</h2>
      <p>Папку целиком, либо <code>device.json</code> + <code>texture.png</code> вместе.</p>
      <p>Читается схема: <code>parts[] → frame, position, size, rotation, layer</code></p>
      <p><input type="file" id="pick" multiple webkitdirectory directory></p>
      <p><input type="file" id="pick2" multiple accept=".json,.png"></p>
      <div id="err"></div>
    </div>
  </div>
</main>

<footer>
  <div class="ctl">
    <label for="explode">Разборка</label>
    <input type="range" id="explode" min="0" max="100" value="0">
    <span id="explodeVal" class="meta">0%</span>
  </div>
  <div class="ctl">
    <label for="spread">Шаг слоя</label>
    <input type="range" id="spread" min="10" max="400" value="120">
  </div>
  <div class="ctl">
    <label for="zoom">Масштаб</label>
    <input type="range" id="zoom" min="10" max="300" value="100">
  </div>
  <button id="play">▶ Анимация</button>
  <button id="reset">Сброс вида</button>
  <button id="flatBtn">Вид сверху</button>
  <button id="isoBtn">Изометрия</button>
</footer>

<!-- Сюда упаковщик вшивает готовый ассет: {"device":{...},"texture":"data:image/png;base64,..."}.
     Пока тут null — страница работает в режиме перетаскивания файлов. -->
<script id="asset-payload" type="application/json">null</script>

<script>
(() => {
  "use strict";

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const dropEl = document.getElementById('drop');
  const errEl = document.getElementById('err');
  const metaEl = document.getElementById('meta');
  const listEl = document.getElementById('list');

  let device = null;         // разобранный device.json
  let texURL = null;         // data/blob URL текстуры
  let nodes = [];            // DOM-узлы деталей
  let hidden = new Set();

  // вид
  const view = { rx: 0, ry: 0, zoom: 1, explode: 0, spread: 120 };
  let playing = false, playT = 0, raf = 0;

  // ---------- загрузка ----------

  function fail(msg) { errEl.textContent = msg; }

  async function readFiles(files) {
    errEl.textContent = '';
    let jsonFile = null, pngFiles = [];
    for (const f of files) {
      const n = (f.name || '').toLowerCase();
      if (n.endsWith('.json')) { if (!jsonFile || n.includes('device')) jsonFile = f; }
      else if (n.endsWith('.png')) pngFiles.push(f);
    }
    if (!jsonFile) {
      const names = Array.from(files).map(f => f.name).slice(0, 8).join(', ');
      return fail('Не нашёл .json среди ' + files.length + ' файлов'
        + (names ? ' (' + names + ')' : '') + '.');
    }
    let data;
    try { data = JSON.parse(await jsonFile.text()); }
    catch (e) { return fail('JSON не разобрался: ' + e.message); }
    if (!data.parts || !data.parts.length) return fail('В JSON нет массива parts.');

    const wantName = (data.texture || 'texture.png').toLowerCase().split(/[\\/]/).pop();
    let tex = pngFiles.find(f => f.name.toLowerCase() === wantName);
    // превью не годится как текстура — отбрасываем заведомо служебные файлы
    if (!tex) tex = pngFiles.find(f => !/preview|contact|sheet/i.test(f.name));
    if (!tex) return fail('Не нашёл текстуру (' + wantName + ') среди перетащенных файлов.');

    if (texURL && texURL.startsWith('blob:')) URL.revokeObjectURL(texURL);
    texURL = URL.createObjectURL(tex);
    device = data;
    hidden = new Set();
    build();
    dropEl.classList.add('hide');
  }

  function collectEntries(entries) {
    // поддержка перетаскивания папки. Все колбэки обвешаны обработчиком ошибки:
    // без него один незавершившийся вызов подвешивал Promise.all и загрузка
    // молча умирала.
    const out = [];
    const walk = entry => new Promise(res => {
      if (!entry) return res();
      if (entry.isFile) {
        entry.file(f => { out.push(f); res(); }, () => res());
      } else if (entry.isDirectory) {
        const rd = entry.createReader();
        // readEntries отдаёт не больше ~100 записей за вызов — читаем, пока не пусто
        const readChunk = () => rd.readEntries(async ents => {
          if (!ents.length) return res();
          for (const e of ents) await walk(e);
          readChunk();
        }, () => res());
        readChunk();
      } else res();
    });
    return Promise.all(entries.map(walk)).then(() => out);
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(res => setTimeout(() => res(null), ms))
    ]);
  }

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); dropEl.classList.remove('hide'); dropEl.classList.add('hot');
  }));
  document.addEventListener('dragleave', e => {
    if (e.relatedTarget === null) dropEl.classList.remove('hot');
  });
  document.addEventListener('drop', async e => {
    e.preventDefault();
    dropEl.classList.remove('hot');
    const dt = e.dataTransfer;
    if (!dt) return fail('Браузер не передал данные перетаскивания.');

    // dataTransfer живёт только внутри обработчика — снимаем всё синхронно,
    // до первого await: и плоский список файлов, и записи файловой системы.
    const flat = Array.from(dt.files || []);
    const entries = [];
    for (const it of Array.from(dt.items || [])) {
      const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (entry) entries.push(entry);
    }

    let files = flat;
    if (entries.length) {
      // обход папок; если завис — падаем обратно на плоский список
      const walked = await withTimeout(collectEntries(entries), 5000);
      if (walked && walked.length) files = walked;
    }
    if (!files.length) {
      return fail('Перетащено 0 файлов. Попробуй кнопки выбора ниже.');
    }
    readFiles(files);
  });
  document.getElementById('pick').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('pick2').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('reload').addEventListener('click', () => dropEl.classList.remove('hide'));

  // ---------- построение сцены ----------

  function build() {
    world.innerHTML = '';
    nodes = [];
    const [tw, th] = device.texture_size || [1024, 1024];
    const [cw, ch] = device.canvas || [1024, 1024];
    const parts = device.parts.slice().sort((a, b) => a.layer - b.layer);

    // авто-масштаб под окно
    const fit = Math.min(stage.clientWidth / cw, stage.clientHeight / ch) * 0.8;
    view.base = isFinite(fit) && fit > 0 ? fit : 1;

    for (const p of parts) {
      const el = document.createElement('div');
      el.className = 'part';
      const sc = p.scale == null ? 1 : p.scale;
      const w = p.size[0] * sc, h = p.size[1] * sc;
      const f = p.frame;
      // кроп из атласа: масштабируем всю текстуру так, чтобы кадр занял w x h
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.backgroundImage = 'url(' + texURL + ')';
      el.style.backgroundSize = (tw * w / f.w) + 'px ' + (th * h / f.h) + 'px';
      el.style.backgroundPosition = (-f.x * w / f.w) + 'px ' + (-f.y * h / f.h) + 'px';
      el.dataset.id = p.id;
      el._p = p;
      world.appendChild(el);
      nodes.push(el);
    }
    metaEl.textContent = (device.device || 'device') + ' · деталей ' + parts.length
      + ' · холст ' + cw + '×' + ch + ' · атлас ' + tw + '×' + th;
    buildList(parts);
    layout();
  }

  function buildList(parts) {
    listEl.innerHTML = '';
    parts.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span>' + (p.name || p.id) + '</span><span class="n">L' + p.layer + '</span>';
      row.addEventListener('click', () => {
        if (hidden.has(p.id)) hidden.delete(p.id); else hidden.add(p.id);
        row.classList.toggle('off');
        layout();
      });
      row.addEventListener('mouseenter', () => {
        const n = nodes.find(n => n.dataset.id === p.id); if (n) n.classList.add('hi');
      });
      row.addEventListener('mouseleave', () => {
        const n = nodes.find(n => n.dataset.id === p.id); if (n) n.classList.remove('hi');
      });
      listEl.appendChild(row);
    });
  }

  // ---------- раскладка / трансформы ----------

  function layout() {
    if (!device) return;
    const [cw, ch] = device.canvas || [1024, 1024];
    const layers = device.parts.map(p => p.layer);
    const minL = Math.min(...layers), maxL = Math.max(...layers);
    const span = Math.max(maxL - minL, 1);

    for (const el of nodes) {
      const p = el._p;
      const sc = p.scale == null ? 1 : p.scale;
      const w = p.size[0] * sc, h = p.size[1] * sc;
      // позиция — центр детали в координатах холста; холст центрируем в мире
      const x = p.position[0] - cw / 2 - w / 2;
      const y = p.position[1] - ch / 2 - h / 2;
      // слои: нижний (layer 0) уходит вниз по Z, верхние поднимаются
      const t = (p.layer - minL) / span;
      const z = (t - 0.5) * view.spread * span * view.explode;
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px)'
        + (p.rotation ? ' rotateZ(' + p.rotation + 'deg)' : '');
      el.style.display = hidden.has(p.id) ? 'none' : '';
      el.style.zIndex = String(1000 + p.layer);
    }
    const s = view.base * view.zoom;
    world.style.transform =
      'rotateX(' + view.rx + 'deg) rotateY(' + view.ry + 'deg) scale(' + s + ')';
  }

  // ---------- управление ----------

  let dragging = false, lx = 0, ly = 0;
  stage.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    view.ry += (e.clientX - lx) * 0.35;
    view.rx -= (e.clientY - ly) * 0.35;
    view.rx = Math.max(-89, Math.min(89, view.rx));
    lx = e.clientX; ly = e.clientY;
    layout();
  });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, () => {
    dragging = false; stage.classList.remove('drag');
  }));
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    view.zoom = Math.max(0.1, Math.min(3, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
    layout();
  }, { passive: false });

  const expl = document.getElementById('explode');
  const explVal = document.getElementById('explodeVal');
  expl.addEventListener('input', () => {
    view.explode = expl.value / 100;
    explVal.textContent = expl.value + '%';
    layout();
  });
  document.getElementById('spread').addEventListener('input', e => {
    view.spread = +e.target.value; layout();
  });
  document.getElementById('zoom').addEventListener('input', e => {
    view.zoom = e.target.value / 100; layout();
  });

  document.getElementById('reset').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; view.zoom = 1; view.explode = 0;
    expl.value = 0; explVal.textContent = '0%';
    document.getElementById('zoom').value = 100;
    layout();
  });
  document.getElementById('flatBtn').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; layout();
  });
  document.getElementById('isoBtn').addEventListener('click', () => {
    view.rx = 54; view.ry = -32; layout();
  });
  document.getElementById('toggleList').addEventListener('click', e => {
    listEl.classList.toggle('open'); e.target.classList.toggle('on');
  });

  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Пауза' : '▶ Анимация';
    playBtn.classList.toggle('on', playing);
    if (playing) {
      if (view.rx === 0 && view.ry === 0) { view.rx = 48; view.ry = -26; }
      tick();
    } else cancelAnimationFrame(raf);
  });

  function tick() {
    playT += 0.012;
    // маятник разборки: 0 -> 1 -> 0, плавно
    const e = (1 - Math.cos(playT)) / 2;
    view.explode = e;
    view.ry += 0.25;
    expl.value = String(Math.round(e * 100));
    explVal.textContent = expl.value + '%';
    layout();
    if (playing) raf = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { if (device) { build(); } });

  // ---------- автозагрузка вшитого ассета ----------
  // file:// не даёт странице читать соседние файлы (CORS), поэтому упаковщик
  // кладёт JSON и текстуру прямо внутрь этой страницы — открывается двойным
  // кликом и сразу показывает сборку.
  (function bootEmbedded() {
    const el = document.getElementById('asset-payload');
    if (!el) return;
    let payload = null;
    try { payload = JSON.parse(el.textContent || 'null'); }
    catch (e) { return fail('Вшитый ассет не разобрался: ' + e.message); }
    if (!payload || !payload.device || !payload.texture) return;
    if (!payload.device.parts || !payload.device.parts.length) {
      return fail('Во вшитом ассете нет деталей.');
    }
    device = payload.device;
    texURL = payload.texture;
    hidden = new Set();
    build();
    dropEl.classList.add('hide');
  })();
})();
</script>
</body>
</html>
