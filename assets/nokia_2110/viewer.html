<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Asset Viewer — layered assembly</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --text: #e8eaef; --dim: #98a0b0; --accent: #5ac8fa; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }

  #drop {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; z-index: 40;
    background: rgba(20,22,26,.92); transition: opacity .15s;
  }
  #drop .box {
    border: 2px dashed var(--line); border-radius: 14px; padding: 40px 52px; max-width: 620px;
  }
  #drop.hide { opacity: 0; pointer-events: none; }
  #drop.hot .box { border-color: var(--accent); background: rgba(90,200,250,.06); }
  #drop h2 { margin: 0 0 10px; font-size: 18px; }
  #drop p { margin: 6px 0; color: var(--dim); }
  #drop code { color: var(--accent); }
  #pick { margin-top: 14px; }

  /* user-select and user-drag are switched off on purpose: on a touch screen a
     second finger would otherwise start a native selection drag, the browser fires
     dragenter and the asset-loading window pops up over the scene. */
  #stage { position: absolute; inset: 0; perspective: 2600px; overflow: hidden;
           cursor: grab; touch-action: none;
           user-select: none; -webkit-user-select: none; }
  #stage.drag { cursor: grabbing; }
  #stage.edit { cursor: default; }
  #stage.edit .part { cursor: move; }
  #stage.moving, #stage.moving .part { cursor: grabbing; }
  /* teardown test: the scene does not rotate, the part under the cursor lights up */
  #stage.test { cursor: default; }
  #stage.test .part { cursor: grab; }
  #stage.test .part:hover { outline: 2px solid var(--accent); }
  #stage.test .part.pull { outline: 2px solid var(--accent); filter: drop-shadow(0 10px 16px rgba(0,0,0,.55)); }
  #world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .part {
    position: absolute; transform-style: preserve-3d;
    background-repeat: no-repeat; image-rendering: auto;
    -webkit-user-drag: none;
    outline: 0 solid rgba(90,200,250,0); transition: outline-color .15s;
  }
  .part.hi { outline: 2px solid var(--accent); }
  .part.sel { outline: 2px dashed var(--accent); }
  .part.ghost { opacity: .45; }
  .shadow { position: absolute; background: #000; opacity: .18; filter: blur(6px); }

  /* Callout schema: an SVG over the scene, transparent to clicks. */
  #schema { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
  #schema text { font: 600 12px/1 system-ui, "Segoe UI", sans-serif; }
  #schema .lead { stroke-width: 1.4; fill: none; }
  #schema .dot { stroke: none; }
  #legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 13;
    background: rgba(20,22,26,.86); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; display: none; gap: 4px; flex-direction: column;
    max-height: 46%; overflow-y: auto; font-size: 12px;
  }
  #legend.on { display: flex; }
  #legend b { font-weight: 600; color: var(--dim); font-size: 11px; text-transform: uppercase; }
  #legend .li { display: flex; align-items: center; gap: 7px; }
  #legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl label { color: var(--dim); font-size: 12px; min-width: 74px; }
  input[type=range] { width: 190px; accent-color: var(--accent); }
  button {
    background: #262b34; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: rgba(90,200,250,.14); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }

  /* The bin: lives in the footer but floats up while a part is being dragged. */
  #bin {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    border: 1px dashed var(--line); border-radius: 9px; color: var(--dim); font-size: 13px;
  }
  #bin.armed { border-color: var(--danger); color: var(--danger); background: rgba(255,107,107,.08); }
  #bin.hot {
    border-color: var(--danger); color: #fff; background: rgba(255,107,107,.32);
    transform: scale(1.06);
  }
  #bin .ico { font-size: 17px; }

  #list {
    position: absolute; right: 0; top: 0; bottom: 0; width: 320px; z-index: 14;
    background: rgba(28,31,38,.96); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 8px; transform: translateX(100%); transition: transform .2s;
  }
  #list.open { transform: none; }
  #list .head {
    color: var(--dim); font-size: 11px; text-transform: uppercase;
    padding: 4px 6px 8px; letter-spacing: .4px;
  }
  .row {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 6px 8px;
    align-items: center; padding: 6px; border-radius: 7px; font-size: 12px;
    border: 1px solid transparent;
  }
  .row:hover { background: rgba(90,200,250,.10); }
  .row.sel { border-color: var(--accent); background: rgba(90,200,250,.12); }
  .row.off { opacity: .45; }
  .row .sw { width: 11px; height: 11px; border-radius: 3px; }
  .row .nm { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .acts { display: flex; gap: 3px; }
  .row .acts button { padding: 2px 6px; font-size: 12px; line-height: 1.2; }
  .row .acts button.del:hover { border-color: var(--danger); color: var(--danger); }
  .row .tp {
    grid-column: 2 / 4; background: #171a21; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace; width: 100%;
  }
  .row .tp:focus { outline: none; border-color: var(--accent); }
  /* Numeric part geometry: X/Y — centre on the canvas, W/H — size on the canvas. */
  .row .geo {
    grid-column: 1 / 4; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  }
  .row .fld { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); }
  .row .fld span { width: 11px; flex: none; text-transform: uppercase; }
  .row .fld input {
    width: 100%; min-width: 0; background: #171a21; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace;
  }
  .row .fld input:focus { outline: none; border-color: var(--accent); }
  /* Teardown test panel: hangs over the scene while the mode is on. */
  #hud {
    position: absolute; left: 12px; top: 12px; z-index: 16; display: none;
    align-items: center; gap: 12px; font-size: 13px;
    background: rgba(28,31,38,.94); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px;
  }
  #hud.on { display: flex; }
  #hud button { padding: 4px 10px; font-size: 12px; }
  #err { color: #ff8a80; padding: 10px 16px; font-size: 13px; }
  #toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(28,31,38,.96); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; z-index: 30; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; }
  .dirty { color: #ffd479; }
</style>
</head>
<body>

<header>
  <h1>Device Asset Viewer</h1>
  <span class="meta" id="meta">no files loaded</span>
  <span style="flex:1"></span>
  <label class="chk"><input type="checkbox" id="schemaChk"> Type schema</label>
  <button id="testBtn">Teardown test</button>
  <button id="editBtn">Editor</button>
  <button id="toggleList">Parts</button>
  <button id="reload">Load another</button>
</header>

<main>
  <div id="stage">
    <div id="world"></div>
    <svg id="schema"></svg>
  </div>
  <div id="legend"></div>
  <aside id="list"></aside>
  <div id="toast"></div>

  <div id="hud">
    <span id="hudTxt"></span>
    <button id="hudReset">Reassemble</button>
  </div>

  <div id="drop">
    <div class="box">
      <h2>Drop an asset here</h2>
      <p>The whole folder, or <code>device.json</code> + <code>texture.png</code> together.</p>
      <p>The schema read: <code>parts[] → frame, position, size, rotation, layer, type</code></p>
      <p><input type="file" id="pick" multiple webkitdirectory directory></p>
      <p><input type="file" id="pick2" multiple accept=".json,.png"></p>
      <div id="err"></div>
    </div>
  </div>
</main>

<footer>
  <div class="ctl">
    <label for="explode">Teardown</label>
    <input type="range" id="explode" min="0" max="100" value="0">
    <span id="explodeVal" class="meta">0%</span>
  </div>
  <div class="ctl">
    <label for="spread">Layer step</label>
    <input type="range" id="spread" min="10" max="400" value="120">
  </div>
  <div class="ctl">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="10" max="300" value="100">
  </div>
  <button id="play">▶ Animate</button>
  <button id="reset">Reset view</button>
  <button id="flatBtn">Top view</button>
  <button id="isoBtn">Isometric</button>
  <span style="flex:1"></span>
  <button id="undoBtn" disabled>↶ Undo</button>
  <button id="saveBtn" disabled>Save device.json</button>
  <div id="bin"><span class="ico">🗑</span><span id="binText">Bin</span></div>
</footer>

<!-- The packer bakes the finished asset in here: {"device":{...},"texture":"data:image/png;base64,..."}.
     While it is null the page runs in drag-and-drop mode. -->
<script id="asset-payload" type="application/json">null</script>

<script>
(() => {
  "use strict";

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const dropEl = document.getElementById('drop');
  const errEl = document.getElementById('err');
  const metaEl = document.getElementById('meta');
  const listEl = document.getElementById('list');
  const schemaEl = document.getElementById('schema');
  const legendEl = document.getElementById('legend');
  const binEl = document.getElementById('bin');
  const binText = document.getElementById('binText');
  const toastEl = document.getElementById('toast');
  const saveBtn = document.getElementById('saveBtn');
  const undoBtn = document.getElementById('undoBtn');
  const editBtn = document.getElementById('editBtn');
  const testBtn = document.getElementById('testBtn');
  const hudEl = document.getElementById('hud');
  const hudTxt = document.getElementById('hudTxt');
  const schemaChk = document.getElementById('schemaChk');

  let device = null;         // the parsed device.json
  let texURL = null;         // data/blob URL of the texture
  // Where "Save" writes. The explorer opens only when there is no target:
  //   {kind:'handle', h}  — the file that was dropped (File System Access API);
  //   {kind:'server', path} — the path baked into OPEN_*.html; the panel server writes it.
  let saveTarget = null;
  const SAVE_URL = 'http://127.0.0.1:7788/api/save-device';
  let nodes = [];            // DOM nodes of the parts
  let hidden = new Set();
  let selected = null;       // id of the selected part
  let editing = false;
  let testing = false;       // teardown test: a jigsaw game, the asset is untouched
  // Part offsets in the teardown test live SEPARATELY from device.parts: the mode
  // changes nothing and does not dirty device.json, everything snaps back on exit.
  const testOff = new Map();  // id → [dx, dy] in canvas coordinates
  let dirty = 0;             // how many edits are unsaved
  const undoStack = [];      // snapshots of parts[] before every edit

  // view
  const view = { rx: 0, ry: 0, zoom: 1, explode: 0, spread: 120, base: 1 };
  // Z gap between neighbouring layers in the assembled state, px: invisible to the
  // eye (perspective 2600px), but the parts stay in different planes
  const MIN_GAP = 0.6;
  let playing = false, playT = 0, raf = 0;

  const NS = 'http://www.w3.org/2000/svg';
  // Callout nodes live across repaints: recreating them every frame is not an
  // option — on rotation the end of a callout would jump to a new point on the
  // ring instantly. Here it is id → {elements, current and target end point}.
  const schemaNodes = new Map();
  let schemaRaf = 0, schemaLast = 0, schemaOx = 0;
  // Frame capture (make_gif.py). Shooting goes pose by pose, not in real time:
  // any number of real milliseconds may pass between screenshots, and callout
  // motion driven by the clock would come out ragged. Here the virtual time step
  // is set — how many ms a callout "lives" per pose() call. We set it equal to
  // the GIF frame delay, and on the recording the callouts trail their parts just
  // as smoothly as in the live viewer. 0 — normal mode, driven by the clock.
  let schemaStepMs = 0;
  const partById = id => device && device.parts.find(p => p.id === id);
  const nodeById = id => nodes.find(n => n.dataset.id === id);
  // the X/Y/W/H fields in the list: id → {x, y, w, h}. Needed so dragging a part
  // writes the new numbers into the row without rebuilding the row.
  const geoInputs = new Map();

  // ---------- type colour ----------
  // The colour must be the same for every part of one type and stable between
  // runs — hence not a palette by order, but a pure function of the string.

  function typeColor(type) {
    const s = String(type || 'misc');
    let h = 2166136261;                      // FNV-1a
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    const hue = h % 360;
    const sat = 62 + (h >>> 9) % 22;         // 62..83
    const lig = 56 + (h >>> 17) % 14;        // 56..69
    return 'hsl(' + hue + ' ' + sat + '% ' + lig + '%)';
  }

  // ---------- loading ----------

  function fail(msg) { errEl.textContent = msg; }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('on'), 1800);
  }

  async function readFiles(files, jsonHandle) {
    errEl.textContent = '';
    saveTarget = jsonHandle ? { kind: 'handle', h: jsonHandle } : null;
    let jsonFile = null, pngFiles = [];
    for (const f of files) {
      const n = (f.name || '').toLowerCase();
      if (n.endsWith('.json')) { if (!jsonFile || n.includes('device')) jsonFile = f; }
      else if (n.endsWith('.png')) pngFiles.push(f);
    }
    if (!jsonFile) {
      const names = Array.from(files).map(f => f.name).slice(0, 8).join(', ');
      return fail('No .json found among ' + files.length + ' files'
        + (names ? ' (' + names + ')' : '') + '.');
    }
    // we write back only into the very file we read
    if (jsonHandle && jsonHandle.name.toLowerCase() !== jsonFile.name.toLowerCase()) {
      saveTarget = null;
    }
    let data;
    try { data = JSON.parse(await jsonFile.text()); }
    catch (e) { return fail('The JSON did not parse: ' + e.message); }
    if (!data.parts || !data.parts.length) return fail('The JSON has no parts array.');

    const wantName = (data.texture || 'texture.png').toLowerCase().split(/[\\/]/).pop();
    let tex = pngFiles.find(f => f.name.toLowerCase() === wantName);
    // a preview is no good as a texture — drop the obviously auxiliary files
    if (!tex) tex = pngFiles.find(f => !/preview|contact|sheet/i.test(f.name));
    if (!tex) return fail('No texture found (' + wantName + ') among the dropped files.');

    if (texURL && texURL.startsWith('blob:')) URL.revokeObjectURL(texURL);
    texURL = URL.createObjectURL(tex);
    adopt(data);
  }

  function adopt(data) {
    device = data;
    hidden = new Set();
    selected = null;
    undoStack.length = 0;
    setDirty(0);
    build();
    dropEl.classList.add('hide');
  }

  function collectEntries(entries) {
    // support for dropping a folder. Every callback carries an error handler:
    // without it one call that never settled hung Promise.all and loading died
    // silently.
    const out = [];
    const walk = entry => new Promise(res => {
      if (!entry) return res();
      if (entry.isFile) {
        entry.file(f => { out.push(f); res(); }, () => res());
      } else if (entry.isDirectory) {
        const rd = entry.createReader();
        // readEntries returns at most ~100 entries per call — read until empty
        const readChunk = () => rd.readEntries(async ents => {
          if (!ents.length) return res();
          for (const e of ents) await walk(e);
          readChunk();
        }, () => res());
        readChunk();
      } else res();
    });
    return Promise.all(entries.map(walk)).then(() => out);
  }

  // The handle of the dropped device.json. It is the right to write into that same
  // file: with it "Save" writes silently, with no explorer window. Works in Chrome;
  // other browsers have no getAsFileSystemHandle — then there is no target.
  async function findJsonHandle(handles) {
    let any = null;
    for (const h of handles) {
      if (!h) continue;
      if (h.kind === 'file' && /\.json$/i.test(h.name)) {
        if (h.name.toLowerCase() === 'device.json') return h;
        any = any || h;
      } else if (h.kind === 'directory') {
        try {
          for await (const [name, ch] of h.entries()) {
            if (ch.kind !== 'file' || !/\.json$/i.test(name)) continue;
            if (name.toLowerCase() === 'device.json') return ch;
            any = any || ch;
          }
        } catch (e) { /* no permission to walk it — we manage without writing */ }
      }
    }
    return any;
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(res => setTimeout(() => res(null), ms))
    ]);
  }

  // React only to dragging FILES in from outside. Without this check any internal
  // drag (a selection, a second finger on a touch screen) opened the loading window
  // right in the middle of rotating the model.
  const draggingFiles = dt => !!dt && Array.from(dt.types || []).includes('Files');

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
    if (!draggingFiles(e.dataTransfer)) return;
    e.preventDefault(); dropEl.classList.remove('hide'); dropEl.classList.add('hot');
  }));
  document.addEventListener('dragleave', e => {
    if (e.relatedTarget === null) dropEl.classList.remove('hot');
  });
  // A native drag inside the scene is not wanted at all — it only fights the rotation.
  stage.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('drop', async e => {
    if (!draggingFiles(e.dataTransfer)) return;
    e.preventDefault();
    dropEl.classList.remove('hot');
    const dt = e.dataTransfer;
    if (!dt) return fail('The browser passed no drag data.');

    // dataTransfer lives only inside the handler — grab everything synchronously,
    // before the first await: both the flat file list and the file-system entries.
    const flat = Array.from(dt.files || []);
    const entries = [];
    const handleWait = [];
    for (const it of Array.from(dt.items || [])) {
      const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (entry) entries.push(entry);
      // the handles are taken in the same synchronous pass: dataTransfer lives
      // only until the first await
      if (it.getAsFileSystemHandle) handleWait.push(it.getAsFileSystemHandle().catch(() => null));
    }

    let files = flat;
    if (entries.length) {
      // walking the folders; if it hangs — fall back to the flat list
      const walked = await withTimeout(collectEntries(entries), 5000);
      if (walked && walked.length) files = walked;
    }
    if (!files.length) {
      return fail('0 files dropped. Try the picker buttons below.');
    }
    const handles = handleWait.length
      ? await withTimeout(Promise.all(handleWait), 4000) || []
      : [];
    readFiles(files, await findJsonHandle(handles));
  });
  document.getElementById('pick').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('pick2').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('reload').addEventListener('click', () => dropEl.classList.remove('hide'));

  // ---------- building the scene ----------

  // Part size and the crop out of the atlas. Lives apart from build(), because W/H
  // are edited live in the editor: the node is not recreated, only recomputed.
  function applyGeom(el, p) {
    const [tw, th] = device.texture_size || [1024, 1024];
    const sc = p.scale == null ? 1 : p.scale;
    const w = Math.max(1, p.size[0] * sc), h = Math.max(1, p.size[1] * sc);
    const f = p.frame;
    // crop out of the atlas: scale the whole texture so the frame takes up w x h
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.backgroundSize = (tw * w / f.w) + 'px ' + (th * h / f.h) + 'px';
    el.style.backgroundPosition = (-f.x * w / f.w) + 'px ' + (-f.y * h / f.h) + 'px';
    return [w, h];
  }

  function build() {
    world.innerHTML = '';
    nodes = [];
    clearSchema();   // callouts are bound to ids — they must be reset when the asset changes
    const [cw, ch] = device.canvas || [1024, 1024];
    device.parts.sort((a, b) => a.layer - b.layer);

    // auto-scale to the window
    const fit = Math.min(stage.clientWidth / cw, stage.clientHeight / ch) * 0.8;
    view.base = isFinite(fit) && fit > 0 ? fit : 1;

    for (const p of device.parts) {
      const el = document.createElement('div');
      el.className = 'part';
      el.style.backgroundImage = 'url(' + texURL + ')';
      applyGeom(el, p);
      el.dataset.id = p.id;
      el._p = p;
      world.appendChild(el);
      nodes.push(el);
    }
    updateMeta();
    buildList();
    layout();
  }

  function updateMeta() {
    const [tw, th] = device.texture_size || [0, 0];
    const [cw, ch] = device.canvas || [0, 0];
    metaEl.innerHTML = (device.device || 'device') + ' · parts ' + device.parts.length
      + ' · canvas ' + cw + '×' + ch + ' · atlas ' + tw + '×' + th
      + (dirty ? ' · <span class="dirty">unsaved edits: ' + dirty + '</span>' : '');
  }

  function setDirty(n) {
    dirty = n;
    saveBtn.disabled = !device;
    undoBtn.disabled = !undoStack.length;
    saveBtn.title = !saveTarget ? 'the file is asked for once, then it writes silently'
      : saveTarget.kind === 'handle' ? 'writing straight into ' + saveTarget.h.name
      : 'writing through the panel into ' + saveTarget.path;
    if (device) updateMeta();
  }

  // ---------- edits ----------

  function snapshot() {
    if (!device) return;
    undoStack.push(JSON.stringify(device.parts));
    if (undoStack.length > 60) undoStack.shift();
  }

  function commit() {
    setDirty(dirty + 1);
    buildList();
    layout();
  }

  function undo() {
    if (!undoStack.length) return;
    device.parts = JSON.parse(undoStack.pop());
    selected = null;
    setDirty(Math.max(0, dirty - 1));
    build();
    toast('Undone');
  }

  // After a removal the layers are renumbered consecutively from 0: a gap in the
  // numbering breaks the teardown order in the game (a "remove part" step would hit an empty layer).
  function renumberLayers() {
    device.parts
      .slice()
      .sort((a, b) => a.layer - b.layer)
      .forEach((p, i) => { p.layer = i; });
  }

  function removePart(id) {
    const p = partById(id);
    if (!p) return;
    snapshot();
    device.parts = device.parts.filter(x => x.id !== id);
    renumberLayers();
    hidden.delete(id);
    if (selected === id) selected = null;
    const n = nodeById(id);
    if (n) { n.remove(); nodes = nodes.filter(x => x !== n); }
    commit();
    updateMeta();
    toast('Cut out: ' + (p.name || p.id));
  }

  function moveLayer(id, dir) {
    const ordered = device.parts.slice().sort((a, b) => a.layer - b.layer);
    const i = ordered.findIndex(p => p.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ordered.length) return;
    snapshot();
    // swap the layers: that keeps the numbers unique and validate clean
    const a = ordered[i], b = ordered[j];
    const t = a.layer; a.layer = b.layer; b.layer = t;
    commit();
  }

  function setType(id, value) {
    const p = partById(id);
    if (!p) return;
    const t = String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'misc';
    if (p.type === t) return;
    snapshot();
    p.type = t;
    setDirty(dirty + 1);
    drawSchema();
    buildList();
  }

  // ---------- parts panel ----------

  // A numeric geometry field. The edit applies live on every keystroke, but the
  // snapshot for Ctrl+Z is taken once per visit to the field — otherwise typing
  // "120" would eat three undo steps.
  function mkField(cap, get, set, min) {
    const wrap = document.createElement('label');
    wrap.className = 'fld';
    const tag = document.createElement('span');
    tag.textContent = cap;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = '1';
    if (min != null) inp.min = String(min);
    inp.value = String(Math.round(get()));
    let touched = false;
    inp.addEventListener('focus', () => { touched = false; });
    inp.addEventListener('input', () => {
      if (inp.value === '') return;                 // the field is cleared before typing
      let v = Number(inp.value);
      if (!isFinite(v)) return;
      if (min != null && v < min) v = min;
      if (!touched) { snapshot(); touched = true; setDirty(dirty + 1); }
      set(Math.round(v));
      layout();
    });
    inp.addEventListener('blur', () => { inp.value = String(Math.round(get())); });
    // the list floats over the scene: without stopPropagation the arrows and Delete
    // flew into the global handler and moved the part instead of the value in the field.
    // Ctrl+Z is let through on purpose: otherwise the browser would roll back the text
    // in the field with its own undo while the asset kept the edit.
    inp.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey) return;
      e.stopPropagation();
      if (e.key === 'Enter') inp.blur();
    });
    wrap.append(tag, inp);
    return { wrap, inp };
  }

  // Dragging a part around the scene writes the numbers into the already drawn fields.
  function syncGeom(id) {
    const g = geoInputs.get(id), p = partById(id);
    if (!g || !p) return;
    const put = (inp, v) => {
      if (inp && document.activeElement !== inp) inp.value = String(Math.round(v));
    };
    put(g.x, p.position[0]); put(g.y, p.position[1]);
    put(g.w, p.size[0]);     put(g.h, p.size[1]);
    put(g.r, p.rotation || 0);
  }

  function buildList() {
    if (!device) return;
    const scrollTop = listEl.scrollTop;
    listEl.innerHTML = '';
    geoInputs.clear();
    const head = document.createElement('div');
    head.className = 'head';
    head.textContent = editing
      ? 'layers top-down · click — select · X/Y/W/H/R or drag · ✕ cut out'
      : 'layers top-down · click — hide';
    listEl.appendChild(head);

    const ordered = device.parts.slice().sort((a, b) => b.layer - a.layer);
    ordered.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row' + (hidden.has(p.id) ? ' off' : '') + (selected === p.id ? ' sel' : '');

      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = typeColor(p.type);
      sw.title = p.type || 'misc';

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = (p.name || p.id);
      nm.title = p.id + ' · layer ' + p.layer;

      const acts = document.createElement('span');
      acts.className = 'acts';
      const mk = (txt, title, fn, cls) => {
        const b = document.createElement('button');
        b.textContent = txt; b.title = title;
        if (cls) b.className = cls;
        b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
        return b;
      };
      acts.appendChild(mk('L' + p.layer, 'layer', () => {}, 'lay'));
      acts.lastChild.disabled = true;
      if (editing) {
        acts.appendChild(mk('↑', 'layer up', () => moveLayer(p.id, 1)));
        acts.appendChild(mk('↓', 'layer down', () => moveLayer(p.id, -1)));
      }
      acts.appendChild(mk(hidden.has(p.id) ? '◌' : '●', 'show/hide', () => {
        if (hidden.has(p.id)) hidden.delete(p.id); else hidden.add(p.id);
        buildList(); layout();
      }));
      if (editing) acts.appendChild(mk('✕', 'cut out of the asset', () => removePart(p.id), 'del'));

      row.append(sw, nm, acts);

      if (editing) {
        const tp = document.createElement('input');
        tp.className = 'tp';
        tp.value = p.type || 'misc';
        tp.title = 'part type — shared across all devices, see PART_TYPES.md';
        tp.addEventListener('change', () => setType(p.id, tp.value));
        tp.addEventListener('keydown', e => {
          if (!e.ctrlKey && !e.metaKey) e.stopPropagation();
          if (e.key === 'Enter') tp.blur();
        });
        row.appendChild(tp);

        const geo = document.createElement('div');
        geo.className = 'geo';
        const fx = mkField('X', () => p.position[0], v => { p.position[0] = v; });
        const fy = mkField('Y', () => p.position[1], v => { p.position[1] = v; });
        const fw = mkField('W', () => p.size[0], v => { p.size[0] = v; }, 1);
        const fh = mkField('H', () => p.size[1], v => { p.size[1] = v; }, 1);
        const fr = mkField('R', () => p.rotation || 0, v => { p.rotation = v; });
        fx.wrap.title = 'X of the part centre on the canvas, px';
        fy.wrap.title = 'Y of the part centre on the canvas, px';
        fw.wrap.title = 'part width on the canvas, px';
        fh.wrap.title = 'part height on the canvas, px';
        fr.wrap.title = 'part rotation, degrees clockwise (turns around the centre)';
        geo.append(fx.wrap, fy.wrap, fw.wrap, fh.wrap, fr.wrap);
        geoInputs.set(p.id, { x: fx.inp, y: fy.inp, w: fw.inp, h: fh.inp, r: fr.inp });
        row.appendChild(geo);
      }

      row.addEventListener('click', ev => {
        // a click in an input is an edit, not a row selection: reselecting kicks
        // buildList() and knocks the focus out in the middle of typing a number
        if (ev.target.closest('input')) return;
        if (editing) select(p.id);
        else {
          if (hidden.has(p.id)) hidden.delete(p.id); else hidden.add(p.id);
          buildList(); layout();
        }
      });
      row.addEventListener('mouseenter', () => { const n = nodeById(p.id); if (n) n.classList.add('hi'); });
      row.addEventListener('mouseleave', () => { const n = nodeById(p.id); if (n) n.classList.remove('hi'); });
      listEl.appendChild(row);
    });
    listEl.scrollTop = scrollTop;
    updateHud();   // the removed counter depends on the number of visible parts
  }

  // force=true — "select, full stop": when a drag starts, a repeat click on an
  // already selected part must not deselect it.
  function select(id, force) {
    selected = (!force && selected === id) ? null : id;
    nodes.forEach(n => n.classList.toggle('sel', n.dataset.id === selected));
    buildList();
  }

  // ---------- layout / transforms ----------

  function layout() {
    if (!device) return;
    const [cw, ch] = device.canvas || [1024, 1024];
    const layers = device.parts.map(p => p.layer);
    const minL = Math.min(...layers), maxL = Math.max(...layers);
    const span = Math.max(maxL - minL, 1);

    for (const el of nodes) {
      const p = el._p;
      const [w, h] = applyGeom(el, p);
      // position — the centre of the part in canvas coordinates; the canvas is centred in the world
      const off = testOff.get(p.id);
      const x = p.position[0] - cw / 2 - w / 2 + (off ? off[0] : 0);
      const y = p.position[1] - ch / 2 - h / 2 + (off ? off[1] : 0);
      // layers: the bottom one (layer 0) goes down along Z, the upper ones rise.
      // MIN_GAP keeps neighbouring layers apart even at explode=0: otherwise every
      // part lands in one plane and the browser shuffles them arbitrarily.
      const t = (p.layer - minL) / span;
      const z = (t - 0.5) * (MIN_GAP + view.spread * view.explode) * span;
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px)'
        + (p.rotation ? ' rotateZ(' + p.rotation + 'deg)' : '');
      el.style.display = hidden.has(p.id) ? 'none' : '';
      // the part in hand is always above the rest, otherwise it dives under a neighbouring layer
      el.style.zIndex = (pull && pull.id === p.id) ? '5000' : String(1000 + p.layer);
    }
    const s = view.base * view.zoom;
    world.style.transform =
      'rotateX(' + view.rx + 'deg) rotateY(' + view.ry + 'deg) scale(' + s + ')';
    drawSchema();
  }

  // ---------- type schema ----------

  function clearSchema() {
    while (schemaEl.firstChild) schemaEl.removeChild(schemaEl.firstChild);
    schemaNodes.clear();
    if (schemaRaf) { cancelAnimationFrame(schemaRaf); schemaRaf = 0; }
  }

  // One callout node: the line, the dot on the part and two labels. Created once
  // per part and only moved after that.
  function makeSchemaNode() {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'lead');
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('class', 'dot');
    dot.setAttribute('r', 3);
    const label = document.createElementNS(NS, 'text');
    const sub = document.createElementNS(NS, 'text');
    sub.setAttribute('fill', 'rgba(232,234,239,.62)');
    sub.setAttribute('font-size', '10');
    schemaEl.append(path, dot, label, sub);
    return { path, dot, label, sub };
  }

  // An animation frame: the callout end eases toward its target exponentially, the
  // dot on the part is set immediately — it has to sit on the part frame for frame.
  function paintSchema(ts) {
    schemaRaf = 0;
    const dt = schemaStepMs || (schemaLast ? Math.min(ts - schemaLast, 80) : 16);
    schemaLast = ts;
    const k = 1 - Math.exp(-dt / 380);  // time constant: larger — softer motion
    let moving = false;

    schemaNodes.forEach(s => {
      const dx = s.tex - s.ex, dy = s.tey - s.ey;
      if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) {
        s.ex += dx * k; s.ey += dy * k; moving = true;
      } else {
        s.ex = s.tex; s.ey = s.tey;
      }
      const right = s.ex >= schemaOx;
      const tx = s.ex + (right ? 30 : -30);
      const lx = tx + (right ? 4 : -4);
      const anchor = right ? 'start' : 'end';

      s.path.setAttribute('d',
        'M' + s.cx + ',' + s.cy + ' L' + s.ex + ',' + s.ey + ' L' + tx + ',' + s.ey);
      s.dot.setAttribute('cx', s.cx); s.dot.setAttribute('cy', s.cy);
      s.label.setAttribute('x', lx); s.label.setAttribute('y', s.ey - 5);
      s.label.setAttribute('text-anchor', anchor);
      s.sub.setAttribute('x', lx); s.sub.setAttribute('y', s.ey + 12);
      s.sub.setAttribute('text-anchor', anchor);
    });

    // During a recording the next frame arrives with pose(): an rAF of our own here
    // would only skew the virtual clock, advancing the callouts between screenshots.
    if (moving && !schemaStepMs) schemaRaf = requestAnimationFrame(paintSchema);
    else if (!moving) schemaLast = 0;
  }

  function drawSchema() {
    legendEl.classList.toggle('on', schemaChk.checked && !!device);
    if (!schemaChk.checked || !device) { clearSchema(); return; }

    const box = stage.getBoundingClientRect();
    schemaEl.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
    schemaEl.setAttribute('width', box.width);
    schemaEl.setAttribute('height', box.height);

    const shown = device.parts.filter(p => !hidden.has(p.id));
    if (!shown.length) { clearSchema(); return; }

    // The callout radius is computed from the bounding box of the whole assembly on
    // screen, so the labels go outside the device instead of lying over the parts.
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    const centers = new Map();
    for (const p of shown) {
      const n = nodeById(p.id);
      if (!n) continue;
      const r = n.getBoundingClientRect();
      const cx = r.left + r.width / 2 - box.left;
      const cy = r.top + r.height / 2 - box.top;
      centers.set(p.id, [cx, cy]);
      minX = Math.min(minX, r.left - box.left); maxX = Math.max(maxX, r.right - box.left);
      minY = Math.min(minY, r.top - box.top);   maxY = Math.max(maxY, r.bottom - box.top);
    }
    if (!centers.size) { clearSchema(); return; }

    const ox = (minX + maxX) / 2, oy = (minY + maxY) / 2;
    schemaOx = ox;                       // the shelf side is computed in paintSchema
    // The callout ring is an ellipse over the assembly bounds: on a wide device a
    // circle crawled off the window and the ends collapsed into one point by clamping.
    // The ring is shrunk to the window in advance. The clamp below used to trim the
    // ends that crawled out — and several callouts landed on one point at the edge,
    // the circular order broke and the lines crossed again. Shrinking the radius as a
    // whole is safe: the order of the ends is preserved.
    const fitX = Math.max(Math.min(ox - 70, box.width - 70 - ox), 40);
    const fitY = Math.max(Math.min(oy - 22, box.height - 22 - oy), 34);
    const Rx = Math.min(Math.max((maxX - minX) / 2 + 60, 110), fitX);
    const Ry = Math.min(Math.max((maxY - minY) / 2 + 44, 90), fitY);

    // The parts lie on top of each other — routing a callout "outward from the centre"
    // would stick every label together. So the ends are spread evenly around the ring,
    // as on a real callout diagram.
    //
    // The order of the ends follows the ANGLE of the part relative to the assembly centre,
    // not the layer. Segments from points spread around the ring in the same circular
    // order as their sources do not cross; sorting by layer gave a part on the left an
    // anchor on the right, and the callouts ran criss-cross through the whole schema.
    // Parts whose centres coincide (a stack along the axis) get neighbouring ends —
    // their callouts leave from one point and cannot cross; the tie-break by distance
    // from the centre simply keeps the layout stable between repaints.
    const TOP = -Math.PI / 2;                     // the ring starts at the top
    const norm = a => {
      let x = a - TOP;
      while (x < 0) x += Math.PI * 2;
      while (x >= Math.PI * 2) x -= Math.PI * 2;
      return x;
    };
    const ordered = shown
      .filter(p => centers.has(p.id))
      .map(p => {
        const [cx, cy] = centers.get(p.id);
        return { p, a: norm(Math.atan2(cy - oy, cx - ox)), d: Math.hypot(cx - ox, cy - oy) };
      })
      .sort((u, v) => u.a - v.a || v.d - u.d);
    const n = ordered.length;
    const alive = new Set();
    ordered.forEach((o, i) => {
      const p = o.p;
      const c = centers.get(p.id);
      const ang = TOP + (i + 0.5) / n * Math.PI * 2;
      let ex = ox + Math.cos(ang) * Rx;
      let ey = oy + Math.sin(ang) * Ry;
      // keep the shelf and the label inside the window
      ex = Math.min(Math.max(ex, 66), box.width - 66);
      ey = Math.min(Math.max(ey, 18), box.height - 14);
      const col = typeColor(p.type);
      alive.add(p.id);

      let s = schemaNodes.get(p.id);
      if (!s) {
        // a new callout appears right in its place, without flying in from a corner
        s = makeSchemaNode();
        s.ex = ex; s.ey = ey;
        schemaNodes.set(p.id, s);
      }
      // the dot on the part — rigidly behind the part, the ring end — through the animation
      s.cx = c[0]; s.cy = c[1];
      s.tex = ex; s.tey = ey;
      s.path.setAttribute('stroke', col);
      s.dot.setAttribute('fill', col);
      s.label.setAttribute('fill', col);
      s.label.textContent = p.type || 'misc';
      s.sub.textContent = p.name || p.id;
    });

    // the part was hidden or cut out — its callout goes with it
    schemaNodes.forEach((s, id) => {
      if (alive.has(id)) return;
      [s.path, s.dot, s.label, s.sub].forEach(el => el.remove());
      schemaNodes.delete(id);
    });

    if (!schemaRaf) schemaRaf = requestAnimationFrame(paintSchema);

    // the legend: one sample per type
    legendEl.innerHTML = '';
    const title = document.createElement('b');
    title.textContent = 'part types';
    legendEl.appendChild(title);
    const seen = new Map();
    shown.forEach(p => seen.set(p.type || 'misc', (seen.get(p.type || 'misc') || 0) + 1));
    Array.from(seen.entries()).sort((a, b) => a[0].localeCompare(b[0])).forEach(([t, cnt]) => {
      const li = document.createElement('div');
      li.className = 'li';
      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = typeColor(t);
      const tx = document.createElement('span');
      tx.textContent = t + (cnt > 1 ? ' ×' + cnt : '');
      li.append(sw, tx);
      legendEl.appendChild(li);
    });
  }

  // ---------- dragging a part: position and the bin ----------

  let move = null;   // {id, sx, sy, ox, oy, moved}

  function overBin(x, y) {
    const r = binEl.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  // Cursor offset on screen → offset in canvas coordinates. The world is rotated
  // rotateX(rx) rotateY(ry) and scaled by s, so a point of the z=0 plane travels
  // across the screen as dsx = s·cos(ry)·dx, dsy = s·(sin(ry)·sin(rx)·dx + cos(rx)·dy).
  // Here that pair is inverted; the cosines are clamped near the edge-on view so the
  // part does not fly thousands of pixels from a single pixel of mouse movement.
  function worldDelta(dsx, dsy) {
    const s = (view.base * view.zoom) || 1;
    const th = view.ry * Math.PI / 180, ph = view.rx * Math.PI / 180;
    const keep = v => (Math.abs(v) < 0.15 ? (v < 0 ? -0.15 : 0.15) : v);
    const dx = dsx / (s * keep(Math.cos(th)));
    const dy = (dsy - s * Math.sin(th) * Math.sin(ph) * dx) / (s * keep(Math.cos(ph)));
    return [dx, dy];
  }

  function startMove(id, e) {
    const p = partById(id);
    if (!p) return;
    move = { id, sx: e.clientX, sy: e.clientY, ox: p.position[0], oy: p.position[1], moved: false };
    select(id, true);
    stage.classList.add('moving');
    binEl.classList.add('armed');
    binText.textContent = 'Drop here — I cut it out';
  }

  function doMove(e) {
    if (!move) return;
    const hot = overBin(e.clientX, e.clientY);
    binEl.classList.toggle('hot', hot);
    const n = nodeById(move.id);
    if (n) n.classList.toggle('ghost', hot);
    if (hot) return;                    // over the bin the part is not dragged
    const p = partById(move.id);
    if (!p) return;
    const dsx = e.clientX - move.sx, dsy = e.clientY - move.sy;
    // threshold: a plain click on a part (selection) must not move it by a pixel
    if (!move.moved && Math.hypot(dsx, dsy) < 3) return;
    if (!move.moved) { snapshot(); move.moved = true; }
    const [dx, dy] = worldDelta(dsx, dsy);
    p.position[0] = Math.round(move.ox + dx);
    p.position[1] = Math.round(move.oy + dy);
    layout();
    syncGeom(move.id);
  }

  function endMove(e) {
    if (!move) return;
    const id = move.id, moved = move.moved, ox = move.ox, oy = move.oy;
    const drop = e && overBin(e.clientX, e.clientY);
    const n = nodeById(id);
    if (n) n.classList.remove('ghost');
    move = null;
    stage.classList.remove('moving');
    binEl.classList.remove('armed', 'hot');
    binText.textContent = 'Bin';

    if (drop) {
      // the part goes into the bin — the offset made on the way is undone so Ctrl+Z
      // brings it back in one press instead of two
      const p = partById(id);
      if (p && moved) { p.position[0] = ox; p.position[1] = oy; undoStack.pop(); }
      return removePart(id);
    }
    if (moved) {
      setDirty(dirty + 1);
      const p = partById(id);
      if (p) toast('Position: ' + Math.round(p.position[0]) + ', ' + Math.round(p.position[1]));
    }
  }

  // ---------- teardown test ----------
  // A check of the game mechanic: flat top-down view, the part under the cursor is
  // grabbed and pulled out like a jigsaw piece. The asset stays untouched — every
  // offset lives in testOff and vanishes when the mode is left.

  let pull = null;   // {id, sx, sy, ox, oy}

  function startPull(id, e) {
    if (!partById(id)) return;
    const off = testOff.get(id) || [0, 0];
    pull = { id, sx: e.clientX, sy: e.clientY, ox: off[0], oy: off[1] };
    const n = nodeById(id);
    if (n) n.classList.add('pull');
    layout();
  }

  function doPull(e) {
    if (!pull) return;
    const [dx, dy] = worldDelta(e.clientX - pull.sx, e.clientY - pull.sy);
    testOff.set(pull.id, [pull.ox + dx, pull.oy + dy]);
    layout();
    updateHud();
  }

  function endPull() {
    if (!pull) return;
    const n = nodeById(pull.id);
    if (n) n.classList.remove('pull');
    pull = null;
    layout();
    updateHud();
  }

  // A part counts as "removed" once it has travelled noticeably further from its place
  // than a shaking hand would move it: that is the teardown step in the game.
  const PULLED = 24;
  function pulledCount() {
    let n = 0;
    testOff.forEach(o => { if (Math.hypot(o[0], o[1]) > PULLED) n++; });
    return n;
  }

  function updateHud() {
    if (!testing || !device) { hudEl.classList.remove('on'); return; }
    hudEl.classList.add('on');
    const total = device.parts.filter(p => !hidden.has(p.id)).length;
    hudTxt.innerHTML = 'removed <b>' + pulledCount() + '</b> of ' + total
      + ' · drag a part with the mouse · double click — put it back';
  }

  function resetPull() {
    testOff.clear();
    layout();
    updateHud();
  }

  function setTesting(on) {
    testing = on;
    testBtn.classList.toggle('on', testing);
    stage.classList.toggle('test', testing);
    if (testing) {
      if (editing) setEditing(false);
      // flat top-down view and the assembled state: we take it apart by hand, not with the slider
      view.rx = 0; view.ry = 0; view.explode = 0;
      expl.value = 0; explVal.textContent = '0%';
      layout();
      toast('Teardown test: drag the parts like a jigsaw. The asset does not change');
    } else {
      resetPull();
    }
    updateHud();
  }

  document.getElementById('hudReset').addEventListener('click', resetPull);
  testBtn.addEventListener('click', () => setTesting(!testing));
  stage.addEventListener('dblclick', e => {
    if (!testing) return;
    const hit = e.target.closest && e.target.closest('.part');
    if (!hit) return;
    testOff.delete(hit.dataset.id);
    layout();
    updateHud();
  });

  // ---------- scene controls ----------

  // Pointers are tracked by id: only the FIRST finger rotates, the second turns on
  // pinch zoom. Previously every pointerdown grabbed the rotation for itself, and
  // the model jumped on a second touch.
  const pointers = new Map();
  let dragging = false, lx = 0, ly = 0, pinchDist = 0, pinchZoom = 1;

  const firstId = () => pointers.keys().next().value;
  function spread() {
    const [a, b] = Array.from(pointers.values());
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function grabFrom(id) {
    const p = pointers.get(id);
    if (!p) return;
    dragging = true; lx = p.x; ly = p.y; stage.classList.add('drag');
  }
  function setZoom(z) {
    view.zoom = Math.max(0.1, Math.min(3, z));
    document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
  }

  stage.addEventListener('pointerdown', e => {
    // teardown test: first of all try to grab the part under the cursor
    if (testing && pointers.size === 0) {
      const hit = e.target.closest && e.target.closest('.part');
      if (hit && !hidden.has(hit.dataset.id)) {
        stage.setPointerCapture(e.pointerId);
        startPull(hit.dataset.id, e);
        return;
      }
    }
    // in the editor a click on a part moves it, a click on empty space rotates the scene
    if (editing && pointers.size === 0) {
      const hit = e.target.closest && e.target.closest('.part');
      if (hit && !hidden.has(hit.dataset.id)) {
        stage.setPointerCapture(e.pointerId);
        startMove(hit.dataset.id, e);
        return;
      }
      if (!hit) select(null);
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    if (pointers.size === 1) {
      // in the teardown test the scene does not rotate: strictly top-down, as in the game
      if (!testing) grabFrom(e.pointerId);
    } else if (pointers.size === 2) {
      dragging = false; stage.classList.remove('drag');
      pinchDist = spread(); pinchZoom = view.zoom;
    }
  });
  stage.addEventListener('pointermove', e => {
    if (pull) { doPull(e); return; }
    if (move) { doMove(e); return; }
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size >= 2) {
      if (pointers.size === 2 && pinchDist > 0) {
        setZoom(pinchZoom * spread() / pinchDist);
        layout();
      }
      return;
    }
    if (!dragging || e.pointerId !== firstId()) return;
    view.ry += (e.clientX - lx) * 0.35;
    view.rx -= (e.clientY - ly) * 0.35;
    view.rx = Math.max(-89, Math.min(89, view.rx));
    lx = e.clientX; ly = e.clientY;
    layout();
  });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, e => {
    if (pull) { endPull(); return; }
    if (move) { endMove(e); return; }
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      // a finger was lifted — the remaining one keeps rotating, with no jerk from stale coordinates
      pinchDist = 0; grabFrom(firstId());
    } else if (pointers.size === 0) {
      dragging = false; pinchDist = 0; stage.classList.remove('drag');
    }
  }));
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    view.zoom = Math.max(0.1, Math.min(3, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
    layout();
  }, { passive: false });

  const expl = document.getElementById('explode');
  const explVal = document.getElementById('explodeVal');
  expl.addEventListener('input', () => {
    view.explode = expl.value / 100;
    explVal.textContent = expl.value + '%';
    layout();
  });
  document.getElementById('spread').addEventListener('input', e => {
    view.spread = +e.target.value; layout();
  });
  document.getElementById('zoom').addEventListener('input', e => {
    view.zoom = e.target.value / 100; layout();
  });

  document.getElementById('reset').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; view.zoom = 1; view.explode = 0;
    expl.value = 0; explVal.textContent = '0%';
    document.getElementById('zoom').value = 100;
    layout();
  });
  document.getElementById('flatBtn').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; layout();
  });
  document.getElementById('isoBtn').addEventListener('click', () => {
    view.rx = 54; view.ry = -32; layout();
  });
  document.getElementById('toggleList').addEventListener('click', e => {
    listEl.classList.toggle('open'); e.currentTarget.classList.toggle('on');
  });

  // The editor and the teardown test do not coexist: one edits the asset, the other
  // deliberately shoves it around the screen.
  function setEditing(on) {
    editing = on;
    editBtn.classList.toggle('on', editing);
    stage.classList.toggle('edit', editing);
    if (editing) {
      if (testing) setTesting(false);
      listEl.classList.add('open');
      document.getElementById('toggleList').classList.add('on');
      toast('Editor: drag a part or edit X/Y/W/H/R in the list, arrows — move by 1 (Shift — 10)');
    } else {
      select(null);
    }
    buildList();
  }

  editBtn.addEventListener('click', () => setEditing(!editing));

  schemaChk.addEventListener('change', drawSchema);
  undoBtn.addEventListener('click', undo);
  // The arrows move the selected part: 1 px, 10 with Shift. Undo accumulates not per
  // keypress but per series: consecutive nudges are one edit.
  let nudgeRun = 0;
  function nudge(dx, dy) {
    const p = partById(selected);
    if (!p) return;
    const now = Date.now();
    if (now - nudgeRun > 900) { snapshot(); setDirty(dirty + 1); }
    nudgeRun = now;
    p.position[0] = Math.round(p.position[0] + dx);
    p.position[1] = Math.round(p.position[1] + dy);
    layout();
    syncGeom(selected);
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    if (!editing) return;
    if (e.key === 'Delete' && selected) removePart(selected);
    if (!selected) return;
    const step = e.shiftKey ? 10 : 1;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (d) { e.preventDefault(); nudge(d[0], d[1]); }
  });

  // ---------- saving ----------

  function cleanCopy() {
    const out = JSON.parse(JSON.stringify(device));
    out.parts.sort((a, b) => a.layer - b.layer);
    out.part_count = out.parts.length;
    out.parts.forEach(p => { if (!p.type) p.type = 'misc'; });
    return out;
  }

  const shortPath = p => String(p).split(/[\\/]/).slice(-2).join('/');

  // Writing straight into the file: works both for a dropped device.json and for the
  // one the user picked in the dialog once per session.
  async function writeHandle(h, blob) {
    if (h.queryPermission) {
      let st = await h.queryPermission({ mode: 'readwrite' });
      if (st === 'prompt' && h.requestPermission) st = await h.requestPermission({ mode: 'readwrite' });
      if (st !== 'granted') return false;
    }
    const w = await h.createWritable();
    await w.write(blob);
    await w.close();
    return true;
  }

  // A page opened by double click lives on file:// and cannot write to disk. But the
  // asset path was baked into it at packaging time — we hand the JSON to the panel
  // server, which puts the file back in place and rebuilds OPEN_*.html.
  async function writeViaServer(path, data) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    try {
      const r = await fetch(SAVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, device: data }),
        signal: ctl.signal,
      });
      const res = await r.json().catch(() => ({}));
      return res && res.ok ? res : { ok: false, message: (res && res.message) || ('HTTP ' + r.status) };
    } catch (e) {
      return { ok: false, message: 'the panel is not answering (' + SAVE_URL + ')' };
    } finally { clearTimeout(t); }
  }

  saveBtn.addEventListener('click', async () => {
    if (!device) return;
    const data = cleanCopy();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

    if (saveTarget && saveTarget.kind === 'handle') {
      try {
        if (await writeHandle(saveTarget.h, blob)) {
          setDirty(0);
          return toast('Saved into ' + saveTarget.h.name + '. Rebuild OPEN_*.html: asset_viewer');
        }
      } catch (e) { toast('Writing into the same file failed: ' + e.message); }
    }

    if (saveTarget && saveTarget.kind === 'server') {
      const res = await writeViaServer(saveTarget.path, data);
      if (res.ok) {
        setDirty(0);
        return toast('Saved into ' + shortPath(res.path) + (res.viewer ? ' · OPEN_*.html rebuilt' : ''));
      }
      toast('Saving through the dialog: ' + res.message);
    }

    // no target (files picked with a button, the panel is not running) — ask for the
    // file once and write into it silently after that
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: 'device.json',
          types: [{ description: 'device.json', accept: { 'application/json': ['.json'] } }],
        });
        if (await writeHandle(h, blob)) {
          saveTarget = { kind: 'handle', h };
          setDirty(0);
          return toast('Saved. From now on I write here, with no dialog');
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'device.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setDirty(0);
    toast('device.json downloaded — put it into the asset folder');
  });

  window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Pause' : '▶ Animate';
    playBtn.classList.toggle('on', playing);
    if (playing) {
      if (view.rx === 0 && view.ry === 0) { view.rx = 48; view.ry = -26; }
      tick();
    } else cancelAnimationFrame(raf);
  });

  function tick() {
    playT += 0.012;
    // the teardown pendulum: 0 -> 1 -> 0, smoothly
    const e = (1 - Math.cos(playT)) / 2;
    view.explode = e;
    view.ry += 0.25;
    expl.value = String(Math.round(e * 100));
    explVal.textContent = expl.value + '%';
    layout();
    if (playing) raf = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { if (device) { build(); } });

  // ---------- remote control for frame-by-frame capture ----------
  // make_gif.py opens this same page in headless Chrome and shoots frames.
  // It cannot reach view/layout from outside — the viewer lives in a closure — and
  // the built-in "Animate" button runs on requestAnimationFrame: its phase depends
  // on when the screenshot managed to fire, and the loop does not close.
  // So a narrow deterministic remote sticks out: set a pose — take a frame. It does
  // not affect how the page behaves for a human.
  window.__capture = {
    ready: () => !!device && nodes.length > 0,
    // span — over how many steps the layers spread: the full teardown travel equals
    // span * spread, and without it the layer step would have to be tuned per device
    // by hand (a phone has 6 layers, a console 14).
    info: () => {
      if (!device) return null;
      const ls = device.parts.map(p => p.layer);
      return {
        device: device.device,
        parts: device.parts.length,
        span: Math.max(Math.max(...ls) - Math.min(...ls), 1),
      };
    },
    // Hide all the chrome: what is left is the scene with the assembly and the type legend.
    chrome: show => {
      for (const sel of ['header', 'footer', '#list', '#hud', '#drop']) {
        const el = document.querySelector(sel);
        if (el) el.style.display = show ? '' : 'none';
      }
      build();   // the scene got taller — recompute the auto-scale for the new size
    },
    // stepMs — how many virtual ms pass per captured frame; 0 leaves the callouts
    // on the real clock (that is how static screenshots are taken)
    schema: (on, stepMs) => {
      schemaStepMs = stepMs || 0;
      schemaChk.checked = !!on;
      drawSchema();
    },
    // The bounding box of the whole assembly on screen in the current pose, as a share
    // of the scene. The capture script fits the scale by it: an exploded assembly is
    // taller than an assembled one, and a zoom picked "by eye" clipped the outer layers
    // on every other device.
    bounds: () => {
      const box = stage.getBoundingClientRect();
      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (const n of nodes) {
        if (n.style.display === 'none') continue;
        const r = n.getBoundingClientRect();
        minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right);
        minY = Math.min(minY, r.top);  maxY = Math.max(maxY, r.bottom);
      }
      if (maxX < minX) return null;
      return {
        w: (maxX - minX) / box.width,
        h: (maxY - minY) / box.height,
      };
    },

    // rx/ry — degrees, explode 0..1, zoom — a share of the auto-scale, spread — layer step in px
    pose: (rx, ry, explode, zoom, spread) => {
      view.rx = rx;
      view.ry = ry;
      view.explode = explode;
      if (zoom != null) view.zoom = zoom;
      if (spread != null) view.spread = spread;
      // the sliders are part of the frame on interface screenshots: if they are not
      // moved, "Teardown 0%" is captioned under an assembly spread into layers
      expl.value = String(Math.round(explode * 100));
      explVal.textContent = expl.value + '%';
      document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
      layout();
      // layout() sets the callout targets, but the next rAF paints them. With snap
      // one call catches them up to the target right here, in this same frame.
      if (schemaChk.checked) paintSchema(performance.now());
    },
  };

  // ---------- auto-loading the baked-in asset ----------
  // file:// does not let a page read the files next to it (CORS), so the packer puts
  // the JSON and the texture right inside this page — it opens on a double click and
  // shows the assembly straight away.
  (function bootEmbedded() {
    const el = document.getElementById('asset-payload');
    if (!el) return;
    let payload = null;
    try { payload = JSON.parse(el.textContent || 'null'); }
    catch (e) { return fail('The baked-in asset did not parse: ' + e.message); }
    if (!payload || !payload.device || !payload.texture) return;
    if (!payload.device.parts || !payload.device.parts.length) {
      return fail('The baked-in asset has no parts.');
    }
    texURL = payload.texture;
    adopt(payload.device);
    // the path the asset was baked from: "Save" returns the edits exactly there
    if (payload.json_path) {
      saveTarget = { kind: 'server', path: payload.json_path };
      setDirty(dirty);   // the hint on the "Save" button knows about the target
    }
  })();
})();
</script>
</body>
</html>
