<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Asset Viewer — слоёная сборка</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --text: #e8eaef; --dim: #98a0b0; --accent: #5ac8fa; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }

  #drop {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; z-index: 40;
    background: rgba(20,22,26,.92); transition: opacity .15s;
  }
  #drop .box {
    border: 2px dashed var(--line); border-radius: 14px; padding: 40px 52px; max-width: 620px;
  }
  #drop.hide { opacity: 0; pointer-events: none; }
  #drop.hot .box { border-color: var(--accent); background: rgba(90,200,250,.06); }
  #drop h2 { margin: 0 0 10px; font-size: 18px; }
  #drop p { margin: 6px 0; color: var(--dim); }
  #drop code { color: var(--accent); }
  #pick { margin-top: 14px; }

  /* user-select и user-drag сняты намеренно: на тач-экране второй палец
     иначе начинает нативное перетаскивание выделения, браузер шлёт dragenter
     и поверх сцены вылезает окно загрузки ассета. */
  #stage { position: absolute; inset: 0; perspective: 2600px; overflow: hidden;
           cursor: grab; touch-action: none;
           user-select: none; -webkit-user-select: none; }
  #stage.drag { cursor: grabbing; }
  #stage.edit { cursor: default; }
  #stage.edit .part { cursor: move; }
  #stage.moving, #stage.moving .part { cursor: grabbing; }
  /* тест-разбор: сцена не вращается, деталь под курсором подсвечивается */
  #stage.test { cursor: default; }
  #stage.test .part { cursor: grab; }
  #stage.test .part:hover { outline: 2px solid var(--accent); }
  #stage.test .part.pull { outline: 2px solid var(--accent); filter: drop-shadow(0 10px 16px rgba(0,0,0,.55)); }
  #world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .part {
    position: absolute; transform-style: preserve-3d;
    background-repeat: no-repeat; image-rendering: auto;
    -webkit-user-drag: none;
    outline: 0 solid rgba(90,200,250,0); transition: outline-color .15s;
  }
  .part.hi { outline: 2px solid var(--accent); }
  .part.sel { outline: 2px dashed var(--accent); }
  .part.ghost { opacity: .45; }
  .shadow { position: absolute; background: #000; opacity: .18; filter: blur(6px); }

  /* Схема выносок: SVG поверх сцены, кликам не мешает. */
  #schema { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
  #schema text { font: 600 12px/1 system-ui, "Segoe UI", sans-serif; }
  #schema .lead { stroke-width: 1.4; fill: none; }
  #schema .dot { stroke: none; }
  #legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 13;
    background: rgba(20,22,26,.86); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; display: none; gap: 4px; flex-direction: column;
    max-height: 46%; overflow-y: auto; font-size: 12px;
  }
  #legend.on { display: flex; }
  #legend b { font-weight: 600; color: var(--dim); font-size: 11px; text-transform: uppercase; }
  #legend .li { display: flex; align-items: center; gap: 7px; }
  #legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl label { color: var(--dim); font-size: 12px; min-width: 74px; }
  input[type=range] { width: 190px; accent-color: var(--accent); }
  button {
    background: #262b34; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: rgba(90,200,250,.14); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }

  /* Корзина: живёт в подвале, но всплывает наверх, пока тащат деталь. */
  #bin {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    border: 1px dashed var(--line); border-radius: 9px; color: var(--dim); font-size: 13px;
  }
  #bin.armed { border-color: var(--danger); color: var(--danger); background: rgba(255,107,107,.08); }
  #bin.hot {
    border-color: var(--danger); color: #fff; background: rgba(255,107,107,.32);
    transform: scale(1.06);
  }
  #bin .ico { font-size: 17px; }

  #list {
    position: absolute; right: 0; top: 0; bottom: 0; width: 320px; z-index: 14;
    background: rgba(28,31,38,.96); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 8px; transform: translateX(100%); transition: transform .2s;
  }
  #list.open { transform: none; }
  #list .head {
    color: var(--dim); font-size: 11px; text-transform: uppercase;
    padding: 4px 6px 8px; letter-spacing: .4px;
  }
  .row {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 6px 8px;
    align-items: center; padding: 6px; border-radius: 7px; font-size: 12px;
    border: 1px solid transparent;
  }
  .row:hover { background: rgba(90,200,250,.10); }
  .row.sel { border-color: var(--accent); background: rgba(90,200,250,.12); }
  .row.off { opacity: .45; }
  .row .sw { width: 11px; height: 11px; border-radius: 3px; }
  .row .nm { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .acts { display: flex; gap: 3px; }
  .row .acts button { padding: 2px 6px; font-size: 12px; line-height: 1.2; }
  .row .acts button.del:hover { border-color: var(--danger); color: var(--danger); }
  .row .tp {
    grid-column: 2 / 4; background: #171a21; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace; width: 100%;
  }
  .row .tp:focus { outline: none; border-color: var(--accent); }
  /* Числовая геометрия детали: X/Y — центр на холсте, W/H — размер на холсте. */
  .row .geo {
    grid-column: 1 / 4; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  }
  .row .fld { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); }
  .row .fld span { width: 11px; flex: none; text-transform: uppercase; }
  .row .fld input {
    width: 100%; min-width: 0; background: #171a21; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace;
  }
  .row .fld input:focus { outline: none; border-color: var(--accent); }
  /* Панель тест-разбора: висит поверх сцены, пока включён режим. */
  #hud {
    position: absolute; left: 12px; top: 12px; z-index: 16; display: none;
    align-items: center; gap: 12px; font-size: 13px;
    background: rgba(28,31,38,.94); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px;
  }
  #hud.on { display: flex; }
  #hud button { padding: 4px 10px; font-size: 12px; }
  #err { color: #ff8a80; padding: 10px 16px; font-size: 13px; }
  #toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(28,31,38,.96); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; z-index: 30; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; }
  .dirty { color: #ffd479; }
</style>
</head>
<body>

<header>
  <h1>Device Asset Viewer</h1>
  <span class="meta" id="meta">файлы не загружены</span>
  <span style="flex:1"></span>
  <label class="chk"><input type="checkbox" id="schemaChk"> Схема типов</label>
  <button id="testBtn">Тест-разбор</button>
  <button id="editBtn">Редактор</button>
  <button id="toggleList">Детали</button>
  <button id="reload">Загрузить другой</button>
</header>

<main>
  <div id="stage">
    <div id="world"></div>
    <svg id="schema"></svg>
  </div>
  <div id="legend"></div>
  <aside id="list"></aside>
  <div id="toast"></div>

  <div id="hud">
    <span id="hudTxt"></span>
    <button id="hudReset">Собрать обратно</button>
  </div>

  <div id="drop">
    <div class="box">
      <h2>Перетащи сюда ассет</h2>
      <p>Папку целиком, либо <code>device.json</code> + <code>texture.png</code> вместе.</p>
      <p>Читается схема: <code>parts[] → frame, position, size, rotation, layer, type</code></p>
      <p><input type="file" id="pick" multiple webkitdirectory directory></p>
      <p><input type="file" id="pick2" multiple accept=".json,.png"></p>
      <div id="err"></div>
    </div>
  </div>
</main>

<footer>
  <div class="ctl">
    <label for="explode">Разборка</label>
    <input type="range" id="explode" min="0" max="100" value="0">
    <span id="explodeVal" class="meta">0%</span>
  </div>
  <div class="ctl">
    <label for="spread">Шаг слоя</label>
    <input type="range" id="spread" min="10" max="400" value="120">
  </div>
  <div class="ctl">
    <label for="zoom">Масштаб</label>
    <input type="range" id="zoom" min="10" max="300" value="100">
  </div>
  <button id="play">▶ Анимация</button>
  <button id="reset">Сброс вида</button>
  <button id="flatBtn">Вид сверху</button>
  <button id="isoBtn">Изометрия</button>
  <span style="flex:1"></span>
  <button id="undoBtn" disabled>↶ Отменить</button>
  <button id="saveBtn" disabled>Сохранить device.json</button>
  <div id="bin"><span class="ico">🗑</span><span id="binText">Корзина</span></div>
</footer>

<!-- Сюда упаковщик вшивает готовый ассет: {"device":{...},"texture":"data:image/png;base64,..."}.
     Пока тут null — страница работает в режиме перетаскивания файлов. -->
<script id="asset-payload" type="application/json">null</script>

<script>
(() => {
  "use strict";

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const dropEl = document.getElementById('drop');
  const errEl = document.getElementById('err');
  const metaEl = document.getElementById('meta');
  const listEl = document.getElementById('list');
  const schemaEl = document.getElementById('schema');
  const legendEl = document.getElementById('legend');
  const binEl = document.getElementById('bin');
  const binText = document.getElementById('binText');
  const toastEl = document.getElementById('toast');
  const saveBtn = document.getElementById('saveBtn');
  const undoBtn = document.getElementById('undoBtn');
  const editBtn = document.getElementById('editBtn');
  const testBtn = document.getElementById('testBtn');
  const hudEl = document.getElementById('hud');
  const hudTxt = document.getElementById('hudTxt');
  const schemaChk = document.getElementById('schemaChk');

  let device = null;         // разобранный device.json
  let texURL = null;         // data/blob URL текстуры
  // Куда пишет «Сохранить». Проводник открываем только когда цели нет:
  //   {kind:'handle', h}  — файл, который перетащили (File System Access API);
  //   {kind:'server', path} — путь, вшитый в ОТКРЫТЬ_*.html; пишет сервер панели.
  let saveTarget = null;
  const SAVE_URL = 'http://127.0.0.1:7788/api/save-device';
  let nodes = [];            // DOM-узлы деталей
  let hidden = new Set();
  let selected = null;       // id выбранной детали
  let editing = false;
  let testing = false;       // тест-разбор: игра в пазл, ассет не меняется
  // Сдвиги деталей в тест-разборе живут ОТДЕЛЬНО от device.parts: режим ничего
  // не правит и не пачкает device.json, при выходе всё встаёт обратно.
  const testOff = new Map();  // id → [dx, dy] в координатах холста
  let dirty = 0;             // сколько правок не сохранено
  const undoStack = [];      // снимки parts[] до каждой правки

  // вид
  const view = { rx: 0, ry: 0, zoom: 1, explode: 0, spread: 120, base: 1 };
  // зазор по Z между соседними слоями в собранном виде, px: глазом не видно
  // (perspective 2600px), но детали остаются в разных плоскостях
  const MIN_GAP = 0.6;
  let playing = false, playT = 0, raf = 0;

  const NS = 'http://www.w3.org/2000/svg';
  // Узлы выносок живут между перерисовками: пересоздавать их каждый кадр
  // нельзя — конец выноски при вращении прыгал бы в новую точку кольца
  // мгновенно. Здесь id → {элементы, текущая и целевая точка конца}.
  const schemaNodes = new Map();
  let schemaRaf = 0, schemaLast = 0, schemaOx = 0;
  const partById = id => device && device.parts.find(p => p.id === id);
  const nodeById = id => nodes.find(n => n.dataset.id === id);
  // поля X/Y/W/H в списке: id → {x, y, w, h}. Нужны, чтобы перетаскивание
  // детали сразу писало новые числа в строку, а строка не пересобиралась.
  const geoInputs = new Map();

  // ---------- цвет типа ----------
  // Цвет обязан быть одинаковым у всех деталей одного типа и стабильным между
  // запусками — поэтому не палитра по порядку, а чистая функция от строки.

  function typeColor(type) {
    const s = String(type || 'misc');
    let h = 2166136261;                      // FNV-1a
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    const hue = h % 360;
    const sat = 62 + (h >>> 9) % 22;         // 62..83
    const lig = 56 + (h >>> 17) % 14;        // 56..69
    return 'hsl(' + hue + ' ' + sat + '% ' + lig + '%)';
  }

  // ---------- загрузка ----------

  function fail(msg) { errEl.textContent = msg; }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('on'), 1800);
  }

  async function readFiles(files, jsonHandle) {
    errEl.textContent = '';
    saveTarget = jsonHandle ? { kind: 'handle', h: jsonHandle } : null;
    let jsonFile = null, pngFiles = [];
    for (const f of files) {
      const n = (f.name || '').toLowerCase();
      if (n.endsWith('.json')) { if (!jsonFile || n.includes('device')) jsonFile = f; }
      else if (n.endsWith('.png')) pngFiles.push(f);
    }
    if (!jsonFile) {
      const names = Array.from(files).map(f => f.name).slice(0, 8).join(', ');
      return fail('Не нашёл .json среди ' + files.length + ' файлов'
        + (names ? ' (' + names + ')' : '') + '.');
    }
    // пишем обратно только в тот самый файл, который и прочитали
    if (jsonHandle && jsonHandle.name.toLowerCase() !== jsonFile.name.toLowerCase()) {
      saveTarget = null;
    }
    let data;
    try { data = JSON.parse(await jsonFile.text()); }
    catch (e) { return fail('JSON не разобрался: ' + e.message); }
    if (!data.parts || !data.parts.length) return fail('В JSON нет массива parts.');

    const wantName = (data.texture || 'texture.png').toLowerCase().split(/[\\/]/).pop();
    let tex = pngFiles.find(f => f.name.toLowerCase() === wantName);
    // превью не годится как текстура — отбрасываем заведомо служебные файлы
    if (!tex) tex = pngFiles.find(f => !/preview|contact|sheet/i.test(f.name));
    if (!tex) return fail('Не нашёл текстуру (' + wantName + ') среди перетащенных файлов.');

    if (texURL && texURL.startsWith('blob:')) URL.revokeObjectURL(texURL);
    texURL = URL.createObjectURL(tex);
    adopt(data);
  }

  function adopt(data) {
    device = data;
    hidden = new Set();
    selected = null;
    undoStack.length = 0;
    setDirty(0);
    build();
    dropEl.classList.add('hide');
  }

  function collectEntries(entries) {
    // поддержка перетаскивания папки. Все колбэки обвешаны обработчиком ошибки:
    // без него один незавершившийся вызов подвешивал Promise.all и загрузка
    // молча умирала.
    const out = [];
    const walk = entry => new Promise(res => {
      if (!entry) return res();
      if (entry.isFile) {
        entry.file(f => { out.push(f); res(); }, () => res());
      } else if (entry.isDirectory) {
        const rd = entry.createReader();
        // readEntries отдаёт не больше ~100 записей за вызов — читаем, пока не пусто
        const readChunk = () => rd.readEntries(async ents => {
          if (!ents.length) return res();
          for (const e of ents) await walk(e);
          readChunk();
        }, () => res());
        readChunk();
      } else res();
    });
    return Promise.all(entries.map(walk)).then(() => out);
  }

  // Хэндл перетащенного device.json. Он и есть право писать в тот же файл:
  // с ним «Сохранить» пишет молча, без окна проводника. Работает в Chrome,
  // в остальных браузерах getAsFileSystemHandle нет — тогда цели не будет.
  async function findJsonHandle(handles) {
    let any = null;
    for (const h of handles) {
      if (!h) continue;
      if (h.kind === 'file' && /\.json$/i.test(h.name)) {
        if (h.name.toLowerCase() === 'device.json') return h;
        any = any || h;
      } else if (h.kind === 'directory') {
        try {
          for await (const [name, ch] of h.entries()) {
            if (ch.kind !== 'file' || !/\.json$/i.test(name)) continue;
            if (name.toLowerCase() === 'device.json') return ch;
            any = any || ch;
          }
        } catch (e) { /* нет прав на обход — обойдёмся без записи */ }
      }
    }
    return any;
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(res => setTimeout(() => res(null), ms))
    ]);
  }

  // Реагируем только на перетаскивание ФАЙЛОВ извне. Без этой проверки любой
  // внутренний drag (выделение, второй палец на тач-экране) открывал окно
  // загрузки прямо посреди вращения модели.
  const draggingFiles = dt => !!dt && Array.from(dt.types || []).includes('Files');

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
    if (!draggingFiles(e.dataTransfer)) return;
    e.preventDefault(); dropEl.classList.remove('hide'); dropEl.classList.add('hot');
  }));
  document.addEventListener('dragleave', e => {
    if (e.relatedTarget === null) dropEl.classList.remove('hot');
  });
  // Нативный drag внутри сцены не нужен вообще — он только мешает вращению.
  stage.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('drop', async e => {
    if (!draggingFiles(e.dataTransfer)) return;
    e.preventDefault();
    dropEl.classList.remove('hot');
    const dt = e.dataTransfer;
    if (!dt) return fail('Браузер не передал данные перетаскивания.');

    // dataTransfer живёт только внутри обработчика — снимаем всё синхронно,
    // до первого await: и плоский список файлов, и записи файловой системы.
    const flat = Array.from(dt.files || []);
    const entries = [];
    const handleWait = [];
    for (const it of Array.from(dt.items || [])) {
      const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (entry) entries.push(entry);
      // хэндлы забираем тем же синхронным проходом: dataTransfer живёт
      // только до первого await
      if (it.getAsFileSystemHandle) handleWait.push(it.getAsFileSystemHandle().catch(() => null));
    }

    let files = flat;
    if (entries.length) {
      // обход папок; если завис — падаем обратно на плоский список
      const walked = await withTimeout(collectEntries(entries), 5000);
      if (walked && walked.length) files = walked;
    }
    if (!files.length) {
      return fail('Перетащено 0 файлов. Попробуй кнопки выбора ниже.');
    }
    const handles = handleWait.length
      ? await withTimeout(Promise.all(handleWait), 4000) || []
      : [];
    readFiles(files, await findJsonHandle(handles));
  });
  document.getElementById('pick').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('pick2').addEventListener('change', e => readFiles(e.target.files));
  document.getElementById('reload').addEventListener('click', () => dropEl.classList.remove('hide'));

  // ---------- построение сцены ----------

  // Размер детали и кроп из атласа. Живёт отдельно от build(), потому что W/H
  // правятся в редакторе на лету: узел не пересоздаём, а пересчитываем.
  function applyGeom(el, p) {
    const [tw, th] = device.texture_size || [1024, 1024];
    const sc = p.scale == null ? 1 : p.scale;
    const w = Math.max(1, p.size[0] * sc), h = Math.max(1, p.size[1] * sc);
    const f = p.frame;
    // кроп из атласа: масштабируем всю текстуру так, чтобы кадр занял w x h
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.backgroundSize = (tw * w / f.w) + 'px ' + (th * h / f.h) + 'px';
    el.style.backgroundPosition = (-f.x * w / f.w) + 'px ' + (-f.y * h / f.h) + 'px';
    return [w, h];
  }

  function build() {
    world.innerHTML = '';
    nodes = [];
    clearSchema();   // выноски привязаны к id — при смене ассета их надо сбросить
    const [cw, ch] = device.canvas || [1024, 1024];
    device.parts.sort((a, b) => a.layer - b.layer);

    // авто-масштаб под окно
    const fit = Math.min(stage.clientWidth / cw, stage.clientHeight / ch) * 0.8;
    view.base = isFinite(fit) && fit > 0 ? fit : 1;

    for (const p of device.parts) {
      const el = document.createElement('div');
      el.className = 'part';
      el.style.backgroundImage = 'url(' + texURL + ')';
      applyGeom(el, p);
      el.dataset.id = p.id;
      el._p = p;
      world.appendChild(el);
      nodes.push(el);
    }
    updateMeta();
    buildList();
    layout();
  }

  function updateMeta() {
    const [tw, th] = device.texture_size || [0, 0];
    const [cw, ch] = device.canvas || [0, 0];
    metaEl.innerHTML = (device.device || 'device') + ' · деталей ' + device.parts.length
      + ' · холст ' + cw + '×' + ch + ' · атлас ' + tw + '×' + th
      + (dirty ? ' · <span class="dirty">не сохранено правок: ' + dirty + '</span>' : '');
  }

  function setDirty(n) {
    dirty = n;
    saveBtn.disabled = !device;
    undoBtn.disabled = !undoStack.length;
    saveBtn.title = !saveTarget ? 'файл спросится один раз, дальше — молча'
      : saveTarget.kind === 'handle' ? 'пишу прямо в ' + saveTarget.h.name
      : 'пишу через панель в ' + saveTarget.path;
    if (device) updateMeta();
  }

  // ---------- правки ----------

  function snapshot() {
    if (!device) return;
    undoStack.push(JSON.stringify(device.parts));
    if (undoStack.length > 60) undoStack.shift();
  }

  function commit() {
    setDirty(dirty + 1);
    buildList();
    layout();
  }

  function undo() {
    if (!undoStack.length) return;
    device.parts = JSON.parse(undoStack.pop());
    selected = null;
    setDirty(Math.max(0, dirty - 1));
    build();
    toast('Отменено');
  }

  // После удаления слои пересобираются подряд с 0: дырка в нумерации ломает
  // порядок разборки в игре (шаг «снять деталь» упирался бы в пустой слой).
  function renumberLayers() {
    device.parts
      .slice()
      .sort((a, b) => a.layer - b.layer)
      .forEach((p, i) => { p.layer = i; });
  }

  function removePart(id) {
    const p = partById(id);
    if (!p) return;
    snapshot();
    device.parts = device.parts.filter(x => x.id !== id);
    renumberLayers();
    hidden.delete(id);
    if (selected === id) selected = null;
    const n = nodeById(id);
    if (n) { n.remove(); nodes = nodes.filter(x => x !== n); }
    commit();
    updateMeta();
    toast('Вырезано: ' + (p.name || p.id));
  }

  function moveLayer(id, dir) {
    const ordered = device.parts.slice().sort((a, b) => a.layer - b.layer);
    const i = ordered.findIndex(p => p.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ordered.length) return;
    snapshot();
    // меняем слои местами: так номера остаются уникальными, а validate чист
    const a = ordered[i], b = ordered[j];
    const t = a.layer; a.layer = b.layer; b.layer = t;
    commit();
  }

  function setType(id, value) {
    const p = partById(id);
    if (!p) return;
    const t = String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'misc';
    if (p.type === t) return;
    snapshot();
    p.type = t;
    setDirty(dirty + 1);
    drawSchema();
    buildList();
  }

  // ---------- панель деталей ----------

  // Числовое поле геометрии. Правка идёт вживую по каждому нажатию, но снимок
  // для Ctrl+Z берётся один раз за заход в поле — иначе набор «120» съедал бы
  // три шага отмены.
  function mkField(cap, get, set, min) {
    const wrap = document.createElement('label');
    wrap.className = 'fld';
    const tag = document.createElement('span');
    tag.textContent = cap;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = '1';
    if (min != null) inp.min = String(min);
    inp.value = String(Math.round(get()));
    let touched = false;
    inp.addEventListener('focus', () => { touched = false; });
    inp.addEventListener('input', () => {
      if (inp.value === '') return;                 // поле чистят перед вводом
      let v = Number(inp.value);
      if (!isFinite(v)) return;
      if (min != null && v < min) v = min;
      if (!touched) { snapshot(); touched = true; setDirty(dirty + 1); }
      set(Math.round(v));
      layout();
    });
    inp.addEventListener('blur', () => { inp.value = String(Math.round(get())); });
    // список висит поверх сцены: без stopPropagation стрелки и Delete улетали
    // в глобальный обработчик и двигали деталь вместо значения в поле.
    // Ctrl+Z наоборот пропускаем наружу: иначе браузер откатывал текст в поле
    // своей внутренней отменой, а ассет оставался с правкой.
    inp.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey) return;
      e.stopPropagation();
      if (e.key === 'Enter') inp.blur();
    });
    wrap.append(tag, inp);
    return { wrap, inp };
  }

  // Перетаскивание детали по сцене пишет числа в уже нарисованные поля.
  function syncGeom(id) {
    const g = geoInputs.get(id), p = partById(id);
    if (!g || !p) return;
    const put = (inp, v) => {
      if (inp && document.activeElement !== inp) inp.value = String(Math.round(v));
    };
    put(g.x, p.position[0]); put(g.y, p.position[1]);
    put(g.w, p.size[0]);     put(g.h, p.size[1]);
    put(g.r, p.rotation || 0);
  }

  function buildList() {
    if (!device) return;
    const scrollTop = listEl.scrollTop;
    listEl.innerHTML = '';
    geoInputs.clear();
    const head = document.createElement('div');
    head.className = 'head';
    head.textContent = editing
      ? 'слои сверху вниз · клик — выбрать · X/Y/W/H/R или перетаскивание · ✕ вырезать'
      : 'слои сверху вниз · клик — скрыть';
    listEl.appendChild(head);

    const ordered = device.parts.slice().sort((a, b) => b.layer - a.layer);
    ordered.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row' + (hidden.has(p.id) ? ' off' : '') + (selected === p.id ? ' sel' : '');

      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = typeColor(p.type);
      sw.title = p.type || 'misc';

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = (p.name || p.id);
      nm.title = p.id + ' · слой ' + p.layer;

      const acts = document.createElement('span');
      acts.className = 'acts';
      const mk = (txt, title, fn, cls) => {
        const b = document.createElement('button');
        b.textContent = txt; b.title = title;
        if (cls) b.className = cls;
        b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
        return b;
      };
      acts.appendChild(mk('L' + p.layer, 'слой', () => {}, 'lay'));
      acts.lastChild.disabled = true;
      if (editing) {
        acts.appendChild(mk('↑', 'слой выше', () => moveLayer(p.id, 1)));
        acts.appendChild(mk('↓', 'слой ниже', () => moveLayer(p.id, -1)));
      }
      acts.appendChild(mk(hidden.has(p.id) ? '◌' : '●', 'показать/скрыть', () => {
        if (hidden.has(p.id)) hidden.delete(p.id); else hidden.add(p.id);
        buildList(); layout();
      }));
      if (editing) acts.appendChild(mk('✕', 'вырезать из ассета', () => removePart(p.id), 'del'));

      row.append(sw, nm, acts);

      if (editing) {
        const tp = document.createElement('input');
        tp.className = 'tp';
        tp.value = p.type || 'misc';
        tp.title = 'тип детали — общий для всех устройств, см. ТИПЫ_ДЕТАЛЕЙ.md';
        tp.addEventListener('change', () => setType(p.id, tp.value));
        tp.addEventListener('keydown', e => {
          if (!e.ctrlKey && !e.metaKey) e.stopPropagation();
          if (e.key === 'Enter') tp.blur();
        });
        row.appendChild(tp);

        const geo = document.createElement('div');
        geo.className = 'geo';
        const fx = mkField('X', () => p.position[0], v => { p.position[0] = v; });
        const fy = mkField('Y', () => p.position[1], v => { p.position[1] = v; });
        const fw = mkField('W', () => p.size[0], v => { p.size[0] = v; }, 1);
        const fh = mkField('H', () => p.size[1], v => { p.size[1] = v; }, 1);
        const fr = mkField('R', () => p.rotation || 0, v => { p.rotation = v; });
        fx.wrap.title = 'X центра детали на холсте, px';
        fy.wrap.title = 'Y центра детали на холсте, px';
        fw.wrap.title = 'ширина детали на холсте, px';
        fh.wrap.title = 'высота детали на холсте, px';
        fr.wrap.title = 'поворот детали, градусы по часовой (крутится вокруг центра)';
        geo.append(fx.wrap, fy.wrap, fw.wrap, fh.wrap, fr.wrap);
        geoInputs.set(p.id, { x: fx.inp, y: fy.inp, w: fw.inp, h: fh.inp, r: fr.inp });
        row.appendChild(geo);
      }

      row.addEventListener('click', ev => {
        // клик в поле ввода — это правка, а не выбор строки: перевыбор дёргает
        // buildList() и сбивает фокус прямо посреди набора числа
        if (ev.target.closest('input')) return;
        if (editing) select(p.id);
        else {
          if (hidden.has(p.id)) hidden.delete(p.id); else hidden.add(p.id);
          buildList(); layout();
        }
      });
      row.addEventListener('mouseenter', () => { const n = nodeById(p.id); if (n) n.classList.add('hi'); });
      row.addEventListener('mouseleave', () => { const n = nodeById(p.id); if (n) n.classList.remove('hi'); });
      listEl.appendChild(row);
    });
    listEl.scrollTop = scrollTop;
    updateHud();   // счётчик снятого зависит от числа видимых деталей
  }

  // force=true — «выбрать и точка»: при начале перетаскивания повторный клик
  // по уже выбранной детали не должен снимать выбор.
  function select(id, force) {
    selected = (!force && selected === id) ? null : id;
    nodes.forEach(n => n.classList.toggle('sel', n.dataset.id === selected));
    buildList();
  }

  // ---------- раскладка / трансформы ----------

  function layout() {
    if (!device) return;
    const [cw, ch] = device.canvas || [1024, 1024];
    const layers = device.parts.map(p => p.layer);
    const minL = Math.min(...layers), maxL = Math.max(...layers);
    const span = Math.max(maxL - minL, 1);

    for (const el of nodes) {
      const p = el._p;
      const [w, h] = applyGeom(el, p);
      // позиция — центр детали в координатах холста; холст центрируем в мире
      const off = testOff.get(p.id);
      const x = p.position[0] - cw / 2 - w / 2 + (off ? off[0] : 0);
      const y = p.position[1] - ch / 2 - h / 2 + (off ? off[1] : 0);
      // слои: нижний (layer 0) уходит вниз по Z, верхние поднимаются.
      // MIN_GAP держит соседние слои разнесёнными даже при explode=0: иначе
      // все детали ложатся в одну плоскость и браузер тасует их произвольно.
      const t = (p.layer - minL) / span;
      const z = (t - 0.5) * (MIN_GAP + view.spread * view.explode) * span;
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px)'
        + (p.rotation ? ' rotateZ(' + p.rotation + 'deg)' : '');
      el.style.display = hidden.has(p.id) ? 'none' : '';
      // деталь в руке всегда поверх остальных, иначе она ныряет под соседний слой
      el.style.zIndex = (pull && pull.id === p.id) ? '5000' : String(1000 + p.layer);
    }
    const s = view.base * view.zoom;
    world.style.transform =
      'rotateX(' + view.rx + 'deg) rotateY(' + view.ry + 'deg) scale(' + s + ')';
    drawSchema();
  }

  // ---------- схема типов ----------

  function clearSchema() {
    while (schemaEl.firstChild) schemaEl.removeChild(schemaEl.firstChild);
    schemaNodes.clear();
    if (schemaRaf) { cancelAnimationFrame(schemaRaf); schemaRaf = 0; }
  }

  // Один узел выноски: линия, точка на детали и две подписи. Создаётся один
  // раз на деталь и дальше только двигается.
  function makeSchemaNode() {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'lead');
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('class', 'dot');
    dot.setAttribute('r', 3);
    const label = document.createElementNS(NS, 'text');
    const sub = document.createElementNS(NS, 'text');
    sub.setAttribute('fill', 'rgba(232,234,239,.62)');
    sub.setAttribute('font-size', '10');
    schemaEl.append(path, dot, label, sub);
    return { path, dot, label, sub };
  }

  // Кадр анимации: конец выноски подтягивается к цели по экспоненте, точка на
  // детали ставится сразу — она обязана сидеть на детали кадр в кадр.
  function paintSchema(ts) {
    schemaRaf = 0;
    const dt = schemaLast ? Math.min(ts - schemaLast, 80) : 16;
    schemaLast = ts;
    const k = 1 - Math.exp(-dt / 380);  // постоянная времени: больше — мягче ход
    let moving = false;

    schemaNodes.forEach(s => {
      const dx = s.tex - s.ex, dy = s.tey - s.ey;
      if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) {
        s.ex += dx * k; s.ey += dy * k; moving = true;
      } else {
        s.ex = s.tex; s.ey = s.tey;
      }
      const right = s.ex >= schemaOx;
      const tx = s.ex + (right ? 30 : -30);
      const lx = tx + (right ? 4 : -4);
      const anchor = right ? 'start' : 'end';

      s.path.setAttribute('d',
        'M' + s.cx + ',' + s.cy + ' L' + s.ex + ',' + s.ey + ' L' + tx + ',' + s.ey);
      s.dot.setAttribute('cx', s.cx); s.dot.setAttribute('cy', s.cy);
      s.label.setAttribute('x', lx); s.label.setAttribute('y', s.ey - 5);
      s.label.setAttribute('text-anchor', anchor);
      s.sub.setAttribute('x', lx); s.sub.setAttribute('y', s.ey + 12);
      s.sub.setAttribute('text-anchor', anchor);
    });

    if (moving) schemaRaf = requestAnimationFrame(paintSchema);
    else schemaLast = 0;
  }

  function drawSchema() {
    legendEl.classList.toggle('on', schemaChk.checked && !!device);
    if (!schemaChk.checked || !device) { clearSchema(); return; }

    const box = stage.getBoundingClientRect();
    schemaEl.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
    schemaEl.setAttribute('width', box.width);
    schemaEl.setAttribute('height', box.height);

    const shown = device.parts.filter(p => !hidden.has(p.id));
    if (!shown.length) { clearSchema(); return; }

    // Радиус выноски считаем от габарита всей сборки на экране, чтобы подписи
    // ушли за пределы устройства, а не легли поверх деталей.
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    const centers = new Map();
    for (const p of shown) {
      const n = nodeById(p.id);
      if (!n) continue;
      const r = n.getBoundingClientRect();
      const cx = r.left + r.width / 2 - box.left;
      const cy = r.top + r.height / 2 - box.top;
      centers.set(p.id, [cx, cy]);
      minX = Math.min(minX, r.left - box.left); maxX = Math.max(maxX, r.right - box.left);
      minY = Math.min(minY, r.top - box.top);   maxY = Math.max(maxY, r.bottom - box.top);
    }
    if (!centers.size) { clearSchema(); return; }

    const ox = (minX + maxX) / 2, oy = (minY + maxY) / 2;
    schemaOx = ox;                       // сторона полки считается в paintSchema
    // Кольцо выносок — эллипс по габариту сборки: на широком устройстве круг
    // вылезал за окно и концы схлопывались клампом в одну точку.
    // Кольцо заранее ужимаем под окно. Раньше вылезшие концы подрезал кламп
    // ниже — и несколько выносок садились на одну точку края, круговой порядок
    // рвался, линии снова пересекались. Ужать радиус целиком безопасно: порядок
    // концов сохраняется.
    const fitX = Math.max(Math.min(ox - 70, box.width - 70 - ox), 40);
    const fitY = Math.max(Math.min(oy - 22, box.height - 22 - oy), 34);
    const Rx = Math.min(Math.max((maxX - minX) / 2 + 60, 110), fitX);
    const Ry = Math.min(Math.max((maxY - minY) / 2 + 44, 90), fitY);

    // Детали лежат друг на друге — если вести выноску «наружу от центра», все
    // подписи слипнутся. Поэтому концы разложены равномерно по кольцу, как на
    // настоящей выносной схеме.
    //
    // Порядок концов — по УГЛУ детали относительно центра сборки, а не по слою.
    // Отрезки из точек, разложенных по кольцу в том же круговом порядке, что и
    // их источники, не пересекаются; сортировка по слою давала детали слева
    // якорь справа, и выноски шли крест-накрест через всю схему. Детали, чьи
    // центры совпали (стопка по оси), получают соседние концы — их выноски
    // выходят из одной точки и пересечься не могут; тай-брейк по удалению от
    // центра просто делает раскладку устойчивой между перерисовками.
    const TOP = -Math.PI / 2;                     // кольцо начинаем сверху
    const norm = a => {
      let x = a - TOP;
      while (x < 0) x += Math.PI * 2;
      while (x >= Math.PI * 2) x -= Math.PI * 2;
      return x;
    };
    const ordered = shown
      .filter(p => centers.has(p.id))
      .map(p => {
        const [cx, cy] = centers.get(p.id);
        return { p, a: norm(Math.atan2(cy - oy, cx - ox)), d: Math.hypot(cx - ox, cy - oy) };
      })
      .sort((u, v) => u.a - v.a || v.d - u.d);
    const n = ordered.length;
    const alive = new Set();
    ordered.forEach((o, i) => {
      const p = o.p;
      const c = centers.get(p.id);
      const ang = TOP + (i + 0.5) / n * Math.PI * 2;
      let ex = ox + Math.cos(ang) * Rx;
      let ey = oy + Math.sin(ang) * Ry;
      // держим полку и подпись внутри окна
      ex = Math.min(Math.max(ex, 66), box.width - 66);
      ey = Math.min(Math.max(ey, 18), box.height - 14);
      const col = typeColor(p.type);
      alive.add(p.id);

      let s = schemaNodes.get(p.id);
      if (!s) {
        // новая выноска появляется сразу на своём месте, без прилёта из угла
        s = makeSchemaNode();
        s.ex = ex; s.ey = ey;
        schemaNodes.set(p.id, s);
      }
      // точка на детали — жёстко за деталью, конец кольца — через анимацию
      s.cx = c[0]; s.cy = c[1];
      s.tex = ex; s.tey = ey;
      s.path.setAttribute('stroke', col);
      s.dot.setAttribute('fill', col);
      s.label.setAttribute('fill', col);
      s.label.textContent = p.type || 'misc';
      s.sub.textContent = p.name || p.id;
    });

    // деталь скрыли или вырезали — её выноска уходит вместе с ней
    schemaNodes.forEach((s, id) => {
      if (alive.has(id)) return;
      [s.path, s.dot, s.label, s.sub].forEach(el => el.remove());
      schemaNodes.delete(id);
    });

    if (!schemaRaf) schemaRaf = requestAnimationFrame(paintSchema);

    // легенда: по одному образцу на тип
    legendEl.innerHTML = '';
    const title = document.createElement('b');
    title.textContent = 'типы деталей';
    legendEl.appendChild(title);
    const seen = new Map();
    shown.forEach(p => seen.set(p.type || 'misc', (seen.get(p.type || 'misc') || 0) + 1));
    Array.from(seen.entries()).sort((a, b) => a[0].localeCompare(b[0])).forEach(([t, cnt]) => {
      const li = document.createElement('div');
      li.className = 'li';
      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = typeColor(t);
      const tx = document.createElement('span');
      tx.textContent = t + (cnt > 1 ? ' ×' + cnt : '');
      li.append(sw, tx);
      legendEl.appendChild(li);
    });
  }

  // ---------- перетаскивание детали: позиция и корзина ----------

  let move = null;   // {id, sx, sy, ox, oy, moved}

  function overBin(x, y) {
    const r = binEl.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  // Сдвиг курсора на экране → сдвиг в координатах холста. Мир повёрнут
  // rotateX(rx) rotateY(ry) и масштабирован s, поэтому точка плоскости z=0
  // едет по экрану как dsx = s·cos(ry)·dx, dsy = s·(sin(ry)·sin(rx)·dx + cos(rx)·dy).
  // Здесь эта пара обращена; косинусы у ребра (вид почти сбоку) прижаты, чтобы
  // деталь не улетала на тысячи пикселей от одного пикселя мыши.
  function worldDelta(dsx, dsy) {
    const s = (view.base * view.zoom) || 1;
    const th = view.ry * Math.PI / 180, ph = view.rx * Math.PI / 180;
    const keep = v => (Math.abs(v) < 0.15 ? (v < 0 ? -0.15 : 0.15) : v);
    const dx = dsx / (s * keep(Math.cos(th)));
    const dy = (dsy - s * Math.sin(th) * Math.sin(ph) * dx) / (s * keep(Math.cos(ph)));
    return [dx, dy];
  }

  function startMove(id, e) {
    const p = partById(id);
    if (!p) return;
    move = { id, sx: e.clientX, sy: e.clientY, ox: p.position[0], oy: p.position[1], moved: false };
    select(id, true);
    stage.classList.add('moving');
    binEl.classList.add('armed');
    binText.textContent = 'Брось сюда — вырежу';
  }

  function doMove(e) {
    if (!move) return;
    const hot = overBin(e.clientX, e.clientY);
    binEl.classList.toggle('hot', hot);
    const n = nodeById(move.id);
    if (n) n.classList.toggle('ghost', hot);
    if (hot) return;                    // над корзиной деталь не таскаем
    const p = partById(move.id);
    if (!p) return;
    const dsx = e.clientX - move.sx, dsy = e.clientY - move.sy;
    // порог: простой клик по детали (выбор) не должен сдвигать её на пиксель
    if (!move.moved && Math.hypot(dsx, dsy) < 3) return;
    if (!move.moved) { snapshot(); move.moved = true; }
    const [dx, dy] = worldDelta(dsx, dsy);
    p.position[0] = Math.round(move.ox + dx);
    p.position[1] = Math.round(move.oy + dy);
    layout();
    syncGeom(move.id);
  }

  function endMove(e) {
    if (!move) return;
    const id = move.id, moved = move.moved, ox = move.ox, oy = move.oy;
    const drop = e && overBin(e.clientX, e.clientY);
    const n = nodeById(id);
    if (n) n.classList.remove('ghost');
    move = null;
    stage.classList.remove('moving');
    binEl.classList.remove('armed', 'hot');
    binText.textContent = 'Корзина';

    if (drop) {
      // деталь уходит в корзину — сдвиг по дороге отменяем, чтобы Ctrl+Z
      // возвращал её одним нажатием, а не двумя
      const p = partById(id);
      if (p && moved) { p.position[0] = ox; p.position[1] = oy; undoStack.pop(); }
      return removePart(id);
    }
    if (moved) {
      setDirty(dirty + 1);
      const p = partById(id);
      if (p) toast('Позиция: ' + Math.round(p.position[0]) + ', ' + Math.round(p.position[1]));
    }
  }

  // ---------- тест-разбор ----------
  // Проверка механики из игры: плоский вид сверху, деталь под курсором берётся
  // и вытаскивается как из пазла. Ассет при этом неприкосновенен — все сдвиги
  // лежат в testOff и пропадают на выходе из режима.

  let pull = null;   // {id, sx, sy, ox, oy}

  function startPull(id, e) {
    if (!partById(id)) return;
    const off = testOff.get(id) || [0, 0];
    pull = { id, sx: e.clientX, sy: e.clientY, ox: off[0], oy: off[1] };
    const n = nodeById(id);
    if (n) n.classList.add('pull');
    layout();
  }

  function doPull(e) {
    if (!pull) return;
    const [dx, dy] = worldDelta(e.clientX - pull.sx, e.clientY - pull.sy);
    testOff.set(pull.id, [pull.ox + dx, pull.oy + dy]);
    layout();
    updateHud();
  }

  function endPull() {
    if (!pull) return;
    const n = nodeById(pull.id);
    if (n) n.classList.remove('pull');
    pull = null;
    layout();
    updateHud();
  }

  // «Снятой» считаем деталь, отъехавшую от своего места заметно дальше дрожания
  // руки: это и есть шаг разборки в игре.
  const PULLED = 24;
  function pulledCount() {
    let n = 0;
    testOff.forEach(o => { if (Math.hypot(o[0], o[1]) > PULLED) n++; });
    return n;
  }

  function updateHud() {
    if (!testing || !device) { hudEl.classList.remove('on'); return; }
    hudEl.classList.add('on');
    const total = device.parts.filter(p => !hidden.has(p.id)).length;
    hudTxt.innerHTML = 'снято <b>' + pulledCount() + '</b> из ' + total
      + ' · тащи деталь мышью · двойной клик — вернуть на место';
  }

  function resetPull() {
    testOff.clear();
    layout();
    updateHud();
  }

  function setTesting(on) {
    testing = on;
    testBtn.classList.toggle('on', testing);
    stage.classList.toggle('test', testing);
    if (testing) {
      if (editing) setEditing(false);
      // плоский вид сверху и собранное состояние: разбираем руками, не ползунком
      view.rx = 0; view.ry = 0; view.explode = 0;
      expl.value = 0; explVal.textContent = '0%';
      layout();
      toast('Тест-разбор: тащи детали как пазл. Ассет не меняется');
    } else {
      resetPull();
    }
    updateHud();
  }

  document.getElementById('hudReset').addEventListener('click', resetPull);
  testBtn.addEventListener('click', () => setTesting(!testing));
  stage.addEventListener('dblclick', e => {
    if (!testing) return;
    const hit = e.target.closest && e.target.closest('.part');
    if (!hit) return;
    testOff.delete(hit.dataset.id);
    layout();
    updateHud();
  });

  // ---------- управление сценой ----------

  // Указатели считаем поимённо: вращает только ПЕРВЫЙ палец, второй включает
  // щипковый зум. Раньше каждый pointerdown перехватывал вращение на себя,
  // и от второго касания модель прыгала.
  const pointers = new Map();
  let dragging = false, lx = 0, ly = 0, pinchDist = 0, pinchZoom = 1;

  const firstId = () => pointers.keys().next().value;
  function spread() {
    const [a, b] = Array.from(pointers.values());
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function grabFrom(id) {
    const p = pointers.get(id);
    if (!p) return;
    dragging = true; lx = p.x; ly = p.y; stage.classList.add('drag');
  }
  function setZoom(z) {
    view.zoom = Math.max(0.1, Math.min(3, z));
    document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
  }

  stage.addEventListener('pointerdown', e => {
    // тест-разбор: первым делом пробуем взять деталь под курсором
    if (testing && pointers.size === 0) {
      const hit = e.target.closest && e.target.closest('.part');
      if (hit && !hidden.has(hit.dataset.id)) {
        stage.setPointerCapture(e.pointerId);
        startPull(hit.dataset.id, e);
        return;
      }
    }
    // в редакторе клик по детали двигает её, клик по пустому месту вращает сцену
    if (editing && pointers.size === 0) {
      const hit = e.target.closest && e.target.closest('.part');
      if (hit && !hidden.has(hit.dataset.id)) {
        stage.setPointerCapture(e.pointerId);
        startMove(hit.dataset.id, e);
        return;
      }
      if (!hit) select(null);
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    if (pointers.size === 1) {
      // в тест-разборе сцена не вращается: вид строго сверху, как в игре
      if (!testing) grabFrom(e.pointerId);
    } else if (pointers.size === 2) {
      dragging = false; stage.classList.remove('drag');
      pinchDist = spread(); pinchZoom = view.zoom;
    }
  });
  stage.addEventListener('pointermove', e => {
    if (pull) { doPull(e); return; }
    if (move) { doMove(e); return; }
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size >= 2) {
      if (pointers.size === 2 && pinchDist > 0) {
        setZoom(pinchZoom * spread() / pinchDist);
        layout();
      }
      return;
    }
    if (!dragging || e.pointerId !== firstId()) return;
    view.ry += (e.clientX - lx) * 0.35;
    view.rx -= (e.clientY - ly) * 0.35;
    view.rx = Math.max(-89, Math.min(89, view.rx));
    lx = e.clientX; ly = e.clientY;
    layout();
  });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, e => {
    if (pull) { endPull(); return; }
    if (move) { endMove(e); return; }
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      // палец убрали — оставшийся продолжает вращать, без рывка от старых координат
      pinchDist = 0; grabFrom(firstId());
    } else if (pointers.size === 0) {
      dragging = false; pinchDist = 0; stage.classList.remove('drag');
    }
  }));
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    view.zoom = Math.max(0.1, Math.min(3, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    document.getElementById('zoom').value = String(Math.round(view.zoom * 100));
    layout();
  }, { passive: false });

  const expl = document.getElementById('explode');
  const explVal = document.getElementById('explodeVal');
  expl.addEventListener('input', () => {
    view.explode = expl.value / 100;
    explVal.textContent = expl.value + '%';
    layout();
  });
  document.getElementById('spread').addEventListener('input', e => {
    view.spread = +e.target.value; layout();
  });
  document.getElementById('zoom').addEventListener('input', e => {
    view.zoom = e.target.value / 100; layout();
  });

  document.getElementById('reset').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; view.zoom = 1; view.explode = 0;
    expl.value = 0; explVal.textContent = '0%';
    document.getElementById('zoom').value = 100;
    layout();
  });
  document.getElementById('flatBtn').addEventListener('click', () => {
    view.rx = 0; view.ry = 0; layout();
  });
  document.getElementById('isoBtn').addEventListener('click', () => {
    view.rx = 54; view.ry = -32; layout();
  });
  document.getElementById('toggleList').addEventListener('click', e => {
    listEl.classList.toggle('open'); e.currentTarget.classList.toggle('on');
  });

  // Редактор и тест-разбор вместе не живут: один правит ассет, второй его
  // нарочно расталкивает по экрану.
  function setEditing(on) {
    editing = on;
    editBtn.classList.toggle('on', editing);
    stage.classList.toggle('edit', editing);
    if (editing) {
      if (testing) setTesting(false);
      listEl.classList.add('open');
      document.getElementById('toggleList').classList.add('on');
      toast('Редактор: тащи деталь или правь X/Y/W/H/R в списке, стрелки — сдвиг на 1 (Shift — 10)');
    } else {
      select(null);
    }
    buildList();
  }

  editBtn.addEventListener('click', () => setEditing(!editing));

  schemaChk.addEventListener('change', drawSchema);
  undoBtn.addEventListener('click', undo);
  // Стрелками двигаем выбранную деталь: 1 px, с Shift — 10. Отмена копится не
  // на каждое нажатие, а на серию: подряд идущие сдвиги — одна правка.
  let nudgeRun = 0;
  function nudge(dx, dy) {
    const p = partById(selected);
    if (!p) return;
    const now = Date.now();
    if (now - nudgeRun > 900) { snapshot(); setDirty(dirty + 1); }
    nudgeRun = now;
    p.position[0] = Math.round(p.position[0] + dx);
    p.position[1] = Math.round(p.position[1] + dy);
    layout();
    syncGeom(selected);
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    if (!editing) return;
    if (e.key === 'Delete' && selected) removePart(selected);
    if (!selected) return;
    const step = e.shiftKey ? 10 : 1;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (d) { e.preventDefault(); nudge(d[0], d[1]); }
  });

  // ---------- сохранение ----------

  function cleanCopy() {
    const out = JSON.parse(JSON.stringify(device));
    out.parts.sort((a, b) => a.layer - b.layer);
    out.part_count = out.parts.length;
    out.parts.forEach(p => { if (!p.type) p.type = 'misc'; });
    return out;
  }

  const shortPath = p => String(p).split(/[\\/]/).slice(-2).join('/');

  // Запись прямо в файл: работает и для перетащенного device.json, и для того,
  // что пользователь выбрал в диалоге один раз за сессию.
  async function writeHandle(h, blob) {
    if (h.queryPermission) {
      let st = await h.queryPermission({ mode: 'readwrite' });
      if (st === 'prompt' && h.requestPermission) st = await h.requestPermission({ mode: 'readwrite' });
      if (st !== 'granted') return false;
    }
    const w = await h.createWritable();
    await w.write(blob);
    await w.close();
    return true;
  }

  // Страница, открытая двойным кликом, живёт на file:// и писать на диск не
  // может. Зато путь ассета вшит в неё при упаковке — отдаём JSON серверу
  // панели, он кладёт файл на место и пересобирает ОТКРЫТЬ_*.html.
  async function writeViaServer(path, data) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    try {
      const r = await fetch(SAVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, device: data }),
        signal: ctl.signal,
      });
      const res = await r.json().catch(() => ({}));
      return res && res.ok ? res : { ok: false, message: (res && res.message) || ('HTTP ' + r.status) };
    } catch (e) {
      return { ok: false, message: 'панель не отвечает (' + SAVE_URL + ')' };
    } finally { clearTimeout(t); }
  }

  saveBtn.addEventListener('click', async () => {
    if (!device) return;
    const data = cleanCopy();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

    if (saveTarget && saveTarget.kind === 'handle') {
      try {
        if (await writeHandle(saveTarget.h, blob)) {
          setDirty(0);
          return toast('Сохранено в ' + saveTarget.h.name + '. Пересобери ОТКРЫТЬ_*.html: asset_viewer');
        }
      } catch (e) { toast('В тот же файл не вышло: ' + e.message); }
    }

    if (saveTarget && saveTarget.kind === 'server') {
      const res = await writeViaServer(saveTarget.path, data);
      if (res.ok) {
        setDirty(0);
        return toast('Сохранено в ' + shortPath(res.path) + (res.viewer ? ' · ОТКРЫТЬ_*.html пересобран' : ''));
      }
      toast('Сохраняю через диалог: ' + res.message);
    }

    // цели нет (файлы выбраны кнопкой, панель не запущена) — спрашиваем файл
    // один раз и дальше пишем в него молча
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: 'device.json',
          types: [{ description: 'device.json', accept: { 'application/json': ['.json'] } }],
        });
        if (await writeHandle(h, blob)) {
          saveTarget = { kind: 'handle', h };
          setDirty(0);
          return toast('Сохранено. Дальше пишу сюда же, без окна');
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'device.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setDirty(0);
    toast('Скачан device.json — положи его в папку ассета');
  });

  window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Пауза' : '▶ Анимация';
    playBtn.classList.toggle('on', playing);
    if (playing) {
      if (view.rx === 0 && view.ry === 0) { view.rx = 48; view.ry = -26; }
      tick();
    } else cancelAnimationFrame(raf);
  });

  function tick() {
    playT += 0.012;
    // маятник разборки: 0 -> 1 -> 0, плавно
    const e = (1 - Math.cos(playT)) / 2;
    view.explode = e;
    view.ry += 0.25;
    expl.value = String(Math.round(e * 100));
    explVal.textContent = expl.value + '%';
    layout();
    if (playing) raf = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { if (device) { build(); } });

  // ---------- автозагрузка вшитого ассета ----------
  // file:// не даёт странице читать соседние файлы (CORS), поэтому упаковщик
  // кладёт JSON и текстуру прямо внутрь этой страницы — открывается двойным
  // кликом и сразу показывает сборку.
  (function bootEmbedded() {
    const el = document.getElementById('asset-payload');
    if (!el) return;
    let payload = null;
    try { payload = JSON.parse(el.textContent || 'null'); }
    catch (e) { return fail('Вшитый ассет не разобрался: ' + e.message); }
    if (!payload || !payload.device || !payload.texture) return;
    if (!payload.device.parts || !payload.device.parts.length) {
      return fail('Во вшитом ассете нет деталей.');
    }
    texURL = payload.texture;
    adopt(payload.device);
    // путь, откуда ассет вшит: «Сохранить» вернёт правки ровно туда
    if (payload.json_path) {
      saveTarget = { kind: 'server', path: payload.json_path };
      setDirty(dirty);   // подсказка на кнопке «Сохранить» знает про цель
    }
  })();
})();
</script>
</body>
</html>
